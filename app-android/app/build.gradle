plugins { id 'com.android.application' }

def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'arcanefusion.app'
    compileSdk 35
    defaultConfig {
        applicationId 'arcanefusion.app'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.1.0'
    }
    signingConfigs {
        upload {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.upload
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { assets.srcDirs += ["$buildDir/generated/gameAssets"] } }
}

def copyGame = tasks.register('copyGame', Sync) {
    from(rootProject.file('../web')) { include 'index.html', 'assets/**', 'sprites/**' }
    into "$buildDir/generated/gameAssets/game"
}
tasks.named('preBuild') { dependsOn copyGame }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.android.billingclient:billing:7.1.1'
    implementation 'com.google.android.gms:play-services-games-v2:21.0.0'
}
