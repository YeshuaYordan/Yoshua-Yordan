/* Layout: one portrait canvas (720x1280 logical) scaled to fit, centered on an ink-dark stage. */
:root {
  --stage: #120a18;
  --ink: #2a1a12;
  --parchment: #f3e3c3;
  --gold: #f2c14e;
  --font-display: "Cinzel Decorative", Georgia, serif;
  --font-body: "Fredoka", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--stage);
  color: var(--parchment);
  font-family: var(--font-body);
  overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#stage {
  height: 100%;
  display: grid;
  place-items: center;
  touch-action: none;
}
canvas {
  display: block;   /* its size is set in applyLayout() to fit the screen */
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
</style>

// Every framed card is stretched so its card body exactly fills the slot (CARD_W x CARD_H), matching the auras.
// vb = the SVG's viewBox (it can reach past the card for wings and gems); body = where the card body sits inside it.
function frameArt(svg, vb, body) {
  const sx = CARD_W / body.w, sy = CARD_H / body.h;
  const slot = { ready: false, canvas: null, dx: (vb.x - body.cx) * sx, dy: (vb.y - body.cy) * sy, dw: vb.w * sx, dh: vb.h * sy };
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = Math.round(slot.dw * 2); c.height = Math.round(slot.dh * 2);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); slot.canvas = c; slot.ready = true;
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  return slot;
}

// ------------------------------------------------------------ Fusion Chamber animation

    for (let i = 0; i < rowsXY.length - 1; i++) {

  if (g.page > 0) { btn.guideBack.x = px + 30; btn.guideBack.y = by; drawBtn(btn.guideBack); }
  if (!g.forced) { btn.guideClose.x = W / 2 - btn.guideClose.w / 2 + (g.page > 0 ? 0 : -90); btn.guideClose.y = by; drawBtn(btn.guideClose); }

// ------------------------------------------------------------ First-run tutorial

const TUT = {

let tut = null;   // { ch, i, t }
const tutStep = () => tut && TUT[tut.ch][tut.i];
const tutBlocking = () => !!tut && !tutStep().wait;
function tutNext() {
  tut.i++; tut.t = 0; playUi("ui_pick");
  if (tut.i >= TUT[tut.ch].length) { save.tut[tut.ch] = true; writeSave(); tut = null; }
}
function tutSkipAll() { for (const k of Object.keys(TUT)) save.tut[k] = true; writeSave(); tut = null; }
function tutStart(ch) { tut = { ch, i: 0, t: 0 }; cancelDrag(); }
// Starts a chapter when its moment comes, and moves on from "do it" steps once they are done.
function tutCheck() {
  if (guide) return;
  if (!save.guide && !tut && state === "break" && wavesCleared >= 1 && !paused && !bookOpen && !chamberOpen && !spell && !drag && !fusion && !doom) { openGuide(true); return; }
  if (tut) { const st = tutStep(); if (st.wait && st.wait()) tutNext(); return; }
  const seen = k => save.tut[k];
  if (state === "title") {
    const calm = lobbyPage === 0 && lobbySettled() && fadeIn <= 0 && !bookOpen && !shopOpen && !summonReveal && !ratesOpen && !cardInfo && !dailyOpen && !bioOpen && !missionsOpen && !settingsOpen;
    if (!seen("lobby") && calm) tutStart("lobby");
    else if (seen("lobby") && calm && !dailyShownThisSession && dailyReady()) { dailyShownThisSession = true; dailyOpen = true; }
    return;
  }
  if (paused || bookOpen || chamberOpen || spell || drag || fusion || doom || (state !== "break" && state !== "wave")) return;
  if (!seen("run1") && state === "break" && wave === 0) tutStart("run1");
  else if (!seen("merge") && state === "break" && wavesCleared >= 1) tutStart("merge");
  else if (!seen("spells") && state === "break" && wavesCleared >= 2) tutStart("spells");
  else if (!seen("chamber") && [...rows.active, ...rows.storage].some(c => c && EL[c.element].tier === 3)) tutStart("chamber");
  else if (!seen("boss") && state === "wave" && spawners.some(s => s.wave % STAGE_LEN === 0)) tutStart("boss");
}
function drawTut(dt) {
  const st = tutStep(); tut.t += dt;
  const hl = st.hl ? st.hl() : null, pulse = 0.5 + 0.5 * Math.sin(tut.t * 5);

  ctx.fillStyle = `rgba(10,5,20,${st.wait ? 0.45 : 0.68})`; ctx.fill("evenodd"); ctx.restore();
  if (hl) { rrect(hl.x - 3, hl.y - 3, hl.w + 6, hl.h + 6, 12); ctx.strokeStyle = `rgba(242,193,78,${0.6 + 0.4 * pulse})`; ctx.lineWidth = 4 + 2 * pulse; ctx.stroke(); }

  const pw = W - 60, px = 30, size = 22, lh = 30;
  ctx.font = `600 ${size}px ${FONT}`;
  const lines = [];
  for (const para of st.b.split("\n")) {   // "\n" starts a new line
    let ln = "";
    for (const wd of para.split(" ")) { const tt = ln ? ln + " " + wd : wd; if (ctx.measureText(tt).width > pw - 48 && ln) { lines.push(ln); ln = wd; } else ln = tt; }
    if (ln) lines.push(ln);
  }
  const ph = 112 + lines.length * lh + 92;
  let py;
  if (!hl) py = H / 2 - ph / 2;
  else if (hl.y + hl.h / 2 < H / 2) py = Math.min(H - ph - 20, hl.y + hl.h + 44);
  else py = Math.max(84, hl.y - ph - 44);

  else { btn.tutNext.label = tut.i === list.length - 1 ? "Got it!" : "Next"; btn.tutNext.x = px + pw - 20 - btn.tutNext.w; btn.tutNext.y = by; drawBtn(btn.tutNext); }
}

// The current stage's weakness, as a small tag under the top buttons.
function drawWeakTag() {
  if (state !== "wave" && state !== "break") return;
  const wk = stageWeak(Math.max(1, wave)); if (!wk) return;
  const label = `Weak to ${EL[wk].name} x${hasRelic("sage") ? 3 : 2}`, x = 14, y = HUD_H + 92 + (curses.size ? 60 : 0);   // under the curse badges
  ctx.font = `800 17px ${FONT}`; const w = ctx.measureText(label).width + 44;
  rrect(x, y, w, 30, 15); ctx.fillStyle = "rgba(20,12,30,0.6)"; ctx.fill(); ctx.strokeStyle = hexA(EL[wk].color, 0.9); ctx.lineWidth = 2; ctx.stroke();
  poly(radialPoly(x + 18, y + 15, 9, EL[wk].shape, 0, 1), EL[wk].color, INK, 1.5);

    const on = storPg(Math.round(storageX / W)) === i, x = W / 2 + (i - (STORAGE_PAGES - 1) / 2) * 22, y = STORAGE_Y - CARD_H / 2 - 9;

// ------------------------------------------------------------ Loop
applyLayout();
let last = performance.now();
// Loading screen: shown until every picture and sound has arrived (at most 20 s, so a bad connection can't block the game).
function drawLoading(now) {
  const k = LOAD.total ? LOAD.done / LOAD.total : 0, t = now / 1000;
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#2a1a44"); bg.addColorStop(1, "#110820"); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 40; i++) { const x = (i * 97.3) % W, y = (i * 211.7 + t * (10 + i % 5) * 6) % H; circle(x, H - y, 1.5 + (i % 3), `rgba(255,220,160,${0.25 + 0.25 * Math.sin(t * 2 + i)})`); }   // drifting sparks
  const cy = H * 0.36;
  ctx.save(); ctx.translate(W / 2, cy - 150); ctx.rotate(t * 1.2);
  for (let i = 0; i < 6; i++) { ctx.rotate(Math.PI / 3); const a = 0.35 + 0.65 * ((Math.sin(t * 4 - i) + 1) / 2); circle(0, -44, 11, `rgba(242,193,78,${a})`); }   // spinning rune dots
  ctx.restore();
  text("ARCANE", W / 2, cy, 76, GOLD, { font: DISPLAY, weight: 900, outline: 14 });
  text("FUSION", W / 2, cy + 78, 76, GOLD, { font: DISPLAY, weight: 900, outline: 14 });
  text("~ Merge & Defend ~", W / 2, cy + 130, 28, PARCH, { outline: 8 });
  const bw = W - 200, bx = 100, by = H * 0.68, bh = 30;
  rrect(bx, by + 5, bw, bh, bh / 2); ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fill();
  rrect(bx, by, bw, bh, bh / 2); ctx.fillStyle = "#2a1d40"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
  if (k > 0.01) { const fw = Math.max(bh, bw * k); rrect(bx, by, fw, bh, bh / 2); const g = ctx.createLinearGradient(0, by, 0, by + bh); g.addColorStop(0, "#ffe27a"); g.addColorStop(1, "#d8941e"); ctx.fillStyle = g; ctx.fill();
    rrect(bx + 6, by + 4, fw - 12, bh * 0.32, bh * 0.16); ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.fill(); }
  text(`Loading...  ${Math.round(k * 100)}%`, W / 2, by + bh + 46, 26, PARCH, { weight: 800, outline: 6 });
}
function frame(now) {

    else { last = now; drawLoading(now); requestAnimationFrame(frame); return; }
  }

  else {
    ctx.save();
    if (shakeT > 0) {   // Doom rumble and impact: shake plus a short camera punch
      const s = shakeAmp * Math.min(1, shakeT);
      ctx.translate(rand(-1, 1) * s, rand(-1, 1) * s);
      if (doom && doom.hit) { const z = 1 + 0.06 * Math.max(0, 1 - (doom.t - DOOM_HIT) / 0.5); ctx.translate(W / 2, (HUD_H + FRONT_Y) / 2); ctx.scale(z, z); ctx.translate(-W / 2, -(HUD_H + FRONT_Y) / 2); }
    }

      text(`Sell for +${sellOf(drag.card.element, drag.card.rarity)} g`, clamp(drag.card.x, 120, W - 120), drag.card.y - CARD_H / 2 - 18, 26, GOLD, { weight: 700, outline: 6 });
  }

  if (missionsOpen && state === "title") drawMissions(dt);
  if (speedOffer && state !== "title") drawSpeedOffer();
  if (relicOffer && (state === "wave" || state === "break")) drawRelicOffer();
  if (testPick && state !== "title") drawTestPicker(dt);
  if (settingsOpen) drawSettings();

prefetchAudio();
requestAnimationFrame(frame);
