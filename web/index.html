<style>
/* Layout: one portrait canvas (720x1280 logical) scaled to fit, centered on an ink-dark stage. */
:root {
  --stage: #120a18;
  --ink: #2a1a12;
  --parchment: #f3e3c3;
  --gold: #f2c14e;
  --font-display: "Cinzel Decorative", Georgia, serif;
  --font-body: "Fredoka", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--stage);
  color: var(--parchment);
  font-family: var(--font-body);
  overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#stage {
  height: 100%;
  display: grid;
  place-items: center;
  touch-action: none;
}
canvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
  aspect-ratio: 9 / 16;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
</style>

<div id="stage"><canvas id="game" width="720" height="1280" aria-label="Arcane Fusion game"></canvas></div>

<script>
"use strict";
// ============================================================ Arcane Fusion: Merge & Defend
const W = 720, H = 1280;
// FRONT_Y: where enemies reach the castle (top edge of the battle row). WALL_Y: top-down wall below the battle row.
const HUD_H = 72, FRONT_Y = 752, WALL_Y = 902, WALL_H = 44;
const ACTIVE_Y = 826, STORAGE_Y = 1016, SHOP_Y = 1172, SHOP_TOP = 1090;
const SLOTS = 5, SHOP_N = 3;
const CASTLE_MAX = 100, BREAK_TIME = 15, START_GOLD = 10, REROLL_BASE = 2;
const CARD_W = 112, CARD_H = 136;
// Sell box under the right side of the Reroll button. SELL_HIT is a little larger so drops are forgiving.
const SELL_RECT = { x: 584, y: 1206, w: 116, h: 60 };
const SELL_HIT = { x: SELL_RECT.x - 14, y: SELL_RECT.y - 14, w: SELL_RECT.w + 28, h: SELL_RECT.h + 22 };
const INK = "#2a1a12", PARCH = "#f3e3c3", GOLD = "#f2c14e";
const FONT = "Fredoka, system-ui, sans-serif";
const DISPLAY = '"Cinzel Decorative", Georgia, serif';

// ------------------------------------------------------------ Card database
const RARITY_NAMES = ["Common", "Uncommon", "Rare", "Epic", "Myth", "Legend"];
// Frame colors from the "Mythical Card Backgrounds" designs.
const RARITY_COLORS = ["#B8BEC8", "#5CBF6E", "#4F8BEA", "#9A68E8", "#E8614E", "#F2B632"];
const RARITY_DMG = [1.0, 1.7, 2.8, 4.5, 7.0, 11.0];
const RARITY_RATE = [1.0, 1.08, 1.16, 1.26, 1.38, 1.5];
const RARITY_PRICE = [3, 6, 12, 24, 45, 80];
const MAX_RARITY = 5;
const BASE = ["fire", "water", "earth", "wind"];
const COUNTERS = { water: "fire", fire: "wind", wind: "earth", earth: "water" };

const EL = {
  fire:      { name: "Fire", tier: 1, color: "#ff7a2f", shape: "flame", parts: ["fire"], desc: "Sets enemies ablaze.", dmg: 8, rate: 1.4, speed: 720, burn: 4 },
  water:     { name: "Water", tier: 1, color: "#3fb8d8", shape: "drop", parts: ["water"], desc: "Splashes enemies back.", dmg: 9, rate: 1.2, speed: 660, knock: 18 },
  earth:     { name: "Earth", tier: 1, color: "#9a7a4a", shape: "rock", parts: ["earth"], desc: "Hurls heavy boulders.", dmg: 20, rate: 0.6, speed: 480, splash: 45 },
  wind:      { name: "Wind", tier: 1, color: "#bfe6e0", shape: "swirl", parts: ["wind"], desc: "Fast gusts pierce foes.", dmg: 6, rate: 2.0, speed: 980, pierce: 2 },
  steam:     { name: "Steam", tier: 2, color: "#d8d4e8", shape: "cloud", parts: ["fire", "water"], desc: "Scalding cloud hurts all inside.", dmg: 8, rate: 0.8, speed: 600, cloud: 80, cloud_dps: 12 },
  lava:      { name: "Lava", tier: 2, color: "#e8452c", shape: "rock", parts: ["fire", "earth"], desc: "Leaves burning magma pools.", dmg: 16, rate: 0.9, speed: 560, puddle: 55, puddle_dps: 10, burn: 4 },
  lightning: { name: "Lightning", tier: 2, color: "#ffe34a", shape: "spiky", parts: ["fire", "wind"], desc: "Thunderbird bolt chains 3 foes.", dmg: 14, rate: 1.0, chain: 3 },
  plant:     { name: "Plant", tier: 2, color: "#5cc36a", shape: "leaf", parts: ["water", "earth"], desc: "Dryad vines root enemies.", dmg: 12, rate: 0.9, speed: 620, root: 1.0 },
  ice:       { name: "Ice", tier: 2, color: "#9fdcff", shape: "crystal", parts: ["water", "wind"], desc: "Frost wolf bite slows foes.", dmg: 11, rate: 1.1, speed: 700, slow: 0.5 },
  dust:      { name: "Dust", tier: 2, color: "#d9b77a", shape: "blob", parts: ["earth", "wind"], desc: "Dust storm blast pushes foes back.", dmg: 10, rate: 1.0, speed: 640, knock: 55, splash: 40 },
  storm:     { name: "Storm", tier: 3, color: "#8a7dff", shape: "cloud", parts: ["fire", "wind", "water"], desc: "Chains 5 foes and slows them.", dmg: 22, rate: 1.1, chain: 5, slow: 0.6 },
  blizzard:  { name: "Blizzard", tier: 3, color: "#e6f6ff", shape: "crystal", parts: ["water", "wind", "earth"], desc: "Freezing blast slows a wide area.", dmg: 14, rate: 0.9, speed: 640, splash: 110, slow: 0.45 },
  obsidian:  { name: "Obsidian", tier: 3, color: "#4a3a5e", shape: "rock", parts: ["fire", "earth", "water", "wind"], desc: "Volcanic glass pierces 5 foes.", dmg: 40, rate: 0.8, speed: 820, pierce: 5 },
  grove:     { name: "Grove", tier: 3, color: "#2f9e55", shape: "leaf", parts: ["water", "earth", "fire"], desc: "Ancient roots trap a whole area.", dmg: 20, rate: 0.8, speed: 560, splash: 90, root: 1.2 },
  wildfire:  { name: "Wildfire", tier: 3, color: "#ff4f1f", shape: "flame", parts: ["fire", "water", "earth", "wind"], desc: "Spreading flames burn an area.", dmg: 14, rate: 1.2, speed: 640, splash: 70, burn: 12 },
  crystal:   { name: "Crystal", tier: 3, color: "#ff8ad8", shape: "crystal", parts: ["earth", "wind", "fire"], desc: "Fires 3 prism shards at once.", dmg: 16, rate: 1.2, speed: 760, multishot: 3 },
};
// Element tiers:
//   Main elements (tier 1): Fire, Earth, Water, Wind. Same + same levels up V1 (Common) > V2 (Uncommon) > V3 (Rare, max).
//   Next elements (tier 2): two different main elements of the SAME level make a next element of that level
//     (V2 Fire + V2 Earth = V2 Lava). Same + same levels up to V3 (Rare, max).
//   Epic elements (tier 3): only two different V3 next elements make one, and it starts at Epic.
//     Same + same levels up Epic > Myth > Legend.
const RECIPE_LIST = [
  ["fire", "earth", "lava"], ["fire", "water", "steam"], ["fire", "wind", "lightning"],
  ["earth", "water", "plant"], ["earth", "wind", "dust"], ["water", "wind", "ice"],
  ["steam", "lightning", "storm"], ["ice", "dust", "blizzard"], ["lava", "ice", "obsidian"],
  ["plant", "steam", "grove"], ["plant", "lightning", "wildfire"], ["dust", "lightning", "crystal"],
];
const RECIPES = {};
const rkey = (a, b) => [a, b].sort().join("+");
for (const r of RECIPE_LIST) RECIPES[rkey(r[0], r[1])] = r[2];

const V3 = 2, EPIC = 3;
// Main and next elements max out at V3 (Rare). Epic elements go up to Legend.
const maxRarity = el => EL[el].tier === 3 ? MAX_RARITY : V3;
function merge(aEl, aR, bEl, bR) {
  if (aEl === bEl) return (aR === bR && aR < maxRarity(aEl)) ? { element: aEl, rarity: aR + 1 } : null;
  const res = RECIPES[rkey(aEl, bEl)];
  if (!res || aR !== bR) return null;
  if (EL[res].tier === 3) return aR === V3 ? { element: res, rarity: EPIC } : null;
  return { element: res, rarity: aR };
}
// Explains why two cards did not fuse (or returns "" when there is nothing useful to say).
function mergeHint(a, b) {
  if (a.element === b.element) {
    if (a.rarity !== b.rarity) return `Both ${EL[a.element].name} cards must be the same level to level up.`;
    if (a.rarity >= maxRarity(a.element)) return `${cardName(a)} is already at max level. Fuse it with a different element instead!`;
    return "";
  }
  const res = RECIPES[rkey(a.element, b.element)];
  if (!res) return `${EL[a.element].name} and ${EL[b.element].name} don't fuse together.`;
  if (EL[res].tier === 3 && (a.rarity !== V3 || b.rarity !== V3)) return "Epic fusions need two V3 (Rare) cards.";
  if (a.rarity !== b.rarity) return `Both cards must be the same level (like V2 + V2) to fuse.`;
  return "";
}
const damageOf = (el, r) => EL[el].dmg * RARITY_DMG[r];
const rateOf = (el, r) => EL[el].rate * RARITY_RATE[r];
const priceOf = (el, r) => RARITY_PRICE[r] * EL[el].tier;
const sellOf = (el, r) => Math.max(1, Math.floor(priceOf(el, r) / 2));
function elementMult(el, resist, flying) {
  let m = 1;
  const parts = EL[el].parts;
  if (resist) {
    if (parts.includes(resist)) m *= 0.5;
    if (parts.some(p => COUNTERS[p] === resist)) m *= 1.5;
  }
  if (flying) {
    if (parts.includes("wind")) m *= 1.6;
    else if (parts.length === 1 && parts[0] === "earth") m *= 0.6;
  }
  return m;
}
function rollRarity(wave) {
  const w = wave;
  const weights = [Math.max(8, 70 - 2.5 * w), 22 + 0.8 * w, 6 + 0.7 * w,
    Math.max(0, 0.5 + 0.45 * (w - 2)), Math.max(0, 0.25 * (w - 8)), Math.max(0, 0.12 * (w - 15))];
  let pick = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < weights.length; i++) { pick -= weights[i]; if (pick <= 0) return i; }
  return 0;
}
const randomBase = () => BASE[Math.floor(Math.random() * 4)];
const describe = (el, r) => `${RARITY_NAMES[r]} ${EL[el].name}: ${Math.round(damageOf(el, r))} dmg, ${rateOf(el, r).toFixed(1)} shots/s. ${EL[el].desc}`;

// ------------------------------------------------------------ Save (per-browser)
const save = { discovered: {}, best: 0 };
try {
  const raw = localStorage.getItem("arcane-fusion-save");
  if (raw) Object.assign(save, JSON.parse(raw));
} catch (e) { /* storage unavailable: play without saving */ }
function writeSave() { try { localStorage.setItem("arcane-fusion-save", JSON.stringify(save)); } catch (e) {} }
function discover(el) { if (save.discovered[el]) return false; save.discovered[el] = true; writeSave(); return true; }

// ------------------------------------------------------------ Canvas & helpers
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function shade(hex, k) { // k<0 darken, k>0 lighten
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const t = k < 0 ? 0 : 255, f = Math.abs(k);
  r = Math.round(lerp(r, t, f)); g = Math.round(lerp(g, t, f)); b = Math.round(lerp(b, t, f));
  return `rgb(${r},${g},${b})`;
}
function mixHex(a, b, k) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const c = s => Math.round(lerp((x >> s) & 255, (y >> s) & 255, k));
  return `rgb(${c(16)},${c(8)},${c(0)})`;
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function ring(x, y, r, stroke, w, a0 = 0, a1 = Math.PI * 2) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), a0, a1); ctx.strokeStyle = stroke; ctx.lineWidth = w; ctx.stroke(); }
function poly(pts, fill, stroke = INK, w = 3) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = w; ctx.lineJoin = "round"; ctx.stroke(); }
}
function text(s, x, y, size, color, opt = {}) {
  ctx.font = `${opt.weight || 600} ${size}px ${opt.font || FONT}`;
  ctx.textAlign = opt.align || "center";
  ctx.textBaseline = opt.baseline || "alphabetic";
  if (opt.outline) { ctx.lineWidth = opt.outline; ctx.strokeStyle = opt.outlineColor || INK; ctx.lineJoin = "round"; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function radialPoly(cx, cy, r, shape, t, seed, n = 28) {
  const pts = [];
  if (shape === "crystal") {
    const radii = [1.45, 0.85, 0.85, 1.25, 0.85, 0.85];
    for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 6; pts.push([cx + Math.cos(a) * r * radii[i], cy + Math.sin(a) * r * radii[i]]); }
    return pts;
  }
  if (shape === "rock") {
    for (let i = 0; i < 9; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 9; const k = 0.88 + 0.16 * Math.sin(seed * 13 + i * 2.7); pts.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k]); }
    return pts;
  }
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / n;
    const up = Math.max(0, -Math.sin(a));
    let rr = r;
    if (shape === "flame") rr = r * (1 + 0.55 * up ** 3 * (0.85 + 0.15 * Math.sin(t * 9 + i)) + 0.12 * up * Math.abs(Math.sin(a * 3 + t * 6)));
    else if (shape === "drop") rr = r * (1 + 0.7 * up ** 6);
    else if (shape === "spiky") rr = r * (i % 2 === 0 ? 1.12 : 0.8);
    else if (shape === "cloud") rr = r * (0.92 + 0.12 * Math.abs(Math.sin(a * 2.5 + 0.4)));
    else rr = r * (1 + 0.05 * Math.sin(a * 5 + t * 3 + seed));
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  return pts;
}
// Classic 1930s "pie-cut" cartoon eye.
function pieEye(x, y, r, lx = 0, ly = 0, blink = false, white = "#fffaf0") {
  if (blink) { ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2, r * 0.35); ctx.lineCap = "round"; ctx.stroke(); return; }
  circle(x, y, r, white);
  ring(x, y, r, INK, Math.max(1.5, r * 0.22));
  const px = x + lx * r * 0.3, py = y + ly * r * 0.3 + r * 0.1, pr = r * 0.58;
  circle(px, py, pr, INK);
  ctx.beginPath(); ctx.moveTo(px, py); ctx.arc(px, py, pr * 1.02, -1.25, -0.45); ctx.closePath();
  ctx.fillStyle = white; ctx.fill();
}
function ellipse(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }

// ------------------------------------------------------------ Card backgrounds (one per rarity)
// Built from the "Mythical Card Backgrounds" design canvas: frame color, scene, corner ornament, gem.
const CI = "#2B2440";
const SCENE_STYLE = `.ink{stroke:${CI};stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.ink2{stroke:${CI};stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.rune{stroke:#9B7BE0;stroke-width:3;stroke-linejoin:round}`;
const CLOUD = 'd="M-40 10 Q-44 -8 -26 -10 Q-22 -28 -2 -24 Q8 -38 24 -26 Q44 -26 42 -6 Q54 4 40 14 Z"';
const spark = (x, y, s) => `<path class="ink2" fill="#FFFFFF" d="M${x} ${y - s} Q${x} ${y} ${x + s} ${y} Q${x} ${y} ${x} ${y + s} Q${x} ${y} ${x - s} ${y} Q${x} ${y} ${x} ${y - s} Z"/>`;
const leaf = (x, y, r) => `<path class="ink2" fill="#7FD08C" transform="translate(${x} ${y}) rotate(${r})" d="M0 -10 Q10 0 0 10 Q-10 0 0 -10 Z"/>`;
const tree = (x, y, r, c) => `<rect class="ink" x="${x - 4}" y="${y}" width="8" height="34" rx="3" fill="#8A5A3B"/><circle class="ink" cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const waveRow = (y, c) => { let d = `M-10 ${y}`; for (let x = -10; x < 350; x += 40) d += ` Q${x + 20} ${y - 18} ${x + 40} ${y}`; return `<path class="ink" fill="${c}" d="${d} L330 470 L-10 470 Z"/>`; };
const crystal = (x, r, s, c) => `<g transform="translate(${x} 464) rotate(${r}) scale(${s})"><path class="ink" fill="${c}" d="M-16 0 L-16 -90 L0 -120 L16 -90 L16 0 Z"/><path fill="#FFFFFF" opacity="0.45" d="M-8 -10 L-8 -88 L0 -106 L0 -10 Z"/></g>`;
const pillar = x => `<rect class="ink" x="${x - 26}" y="170" width="52" height="20" rx="4" fill="#FFF1E2"/><rect class="ink" x="${x - 20}" y="190" width="40" height="230" fill="#F7E6D2"/>${[-14, -4, 6].map(o => `<rect x="${x + o}" y="190" width="3" height="230" rx="1.5" fill="#D9C2A8"/>`).join("")}<rect class="ink" x="${x - 28}" y="420" width="56" height="18" rx="4" fill="#FFF1E2"/><g transform="translate(${x} 170) scale(0.8)"><path class="ink" fill="#FF7A45" d="M0 -60 Q30 -26 22 0 Q14 22 0 22 Q-14 22 -22 0 Q-30 -22 -6 -40 Q-8 -24 4 -18 Q10 -40 0 -60 Z"/><path fill="#FFD25A" d="M0 -20 Q12 -6 8 6 Q4 14 0 14 Q-4 14 -8 6 Q-10 -6 0 -20 Z"/></g>`;
const sunburst = () => { let out = ""; for (let i = 0; i < 24; i++) { const a0 = i * Math.PI / 12, a1 = (i + 1) * Math.PI / 12; out += `<path fill="${i % 2 ? "#FFF4CC" : "#FFE69A"}" d="M160 180 L${160 + 600 * Math.cos(a0)} ${180 + 600 * Math.sin(a0)} L${160 + 600 * Math.cos(a1)} ${180 + 600 * Math.sin(a1)} Z"/>`; } return out; };
const RARITY_ART = [
  { frame: "#B8BEC8", gem: "#7F8794", corner: null,
    scene: `<rect width="320" height="464" fill="#E6E9EE"/><g transform="translate(70 70)"><path class="ink" fill="#FFFFFF" ${CLOUD}/></g><g transform="translate(250 120) scale(0.8)"><path class="ink" fill="#FFFFFF" ${CLOUD}/></g><path class="ink" fill="#CBD0D8" d="M-10 330 Q80 250 170 310 Q250 260 330 300 L330 470 L-10 470 Z"/><path class="ink" fill="#AEB5C0" d="M-10 380 Q100 330 200 375 Q270 350 330 370 L330 470 L-10 470 Z"/><path class="ink" fill="#959DAA" d="M140 380 L146 320 Q160 306 174 320 L180 380 Z"/>` },
  { frame: "#5CBF6E", gem: "#2F8A45", corner: `<path class="ink" fill="#5CBF6E" d="M4 28 Q4 4 28 4 Q28 28 4 28 Z"/><path class="ink2" fill="none" d="M6 26 L22 10"/>`,
    scene: `<rect width="320" height="464" fill="#E2F6E4"/><circle class="ink" cx="250" cy="90" r="34" fill="#FFF3B0"/>${leaf(60, 90, 20)}${leaf(270, 60, -30)}${leaf(200, 150, 45)}${leaf(110, 190, -15)}${leaf(290, 210, 10)}<path class="ink" fill="#A9DFB1" d="M-10 330 Q90 270 180 320 Q260 280 330 310 L330 470 L-10 470 Z"/>${tree(60, 300, 26, "#58B868")}${tree(250, 280, 32, "#4AA85B")}${tree(150, 330, 20, "#6CC77B")}<path class="ink" fill="#7CC98A" d="M-10 390 Q110 340 210 385 Q280 360 330 380 L330 470 L-10 470 Z"/>` },
  { frame: "#4F8BEA", gem: "#2A5DB8", corner: `<path class="ink" fill="#FFFFFF" d="M16 2 L20 12 L30 16 L20 20 L16 30 L12 20 L2 16 L12 12 Z"/>`,

// Card art is 360 x 437 units (same shape as an in-game card), plus 24 units above and below for the gem and pip pill.
const ART_W = 360, ART_H = 437, ART_PAD = 24;
function cardSvg(r) {
  const a = RARITY_ART[r];
  const corners = a.corner ? [[19, 19, 0], [341, 19, 90], [341, 418, 180], [19, 418, 270]].map(([x, y, rot]) =>
    `<g transform="translate(${x} ${y}) rotate(${rot}) translate(-15 -15) scale(0.9375)">${a.corner}</g>`).join("") : "";
  const n = r + 1, pw = 24 + n * 12 + (n - 1) * 5, px = ART_W / 2 - pw / 2;
  const pips = Array.from({ length: n }, (_, i) => `<circle cx="${px + 12 + 6 + i * 17}" cy="${ART_H + 2}" r="5" fill="${a.gem}" stroke="${CI}" stroke-width="2"/>`).join("");
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${ART_W}" height="${ART_H + ART_PAD * 2}" viewBox="0 ${-ART_PAD} ${ART_W} ${ART_H + ART_PAD * 2}">
<defs><style>${SCENE_STYLE}</style><clipPath id="c"><rect x="21" y="21" width="318" height="395" rx="18"/></clipPath></defs>
<rect x="2.5" y="2.5" width="355" height="432" rx="28" fill="${a.frame}" stroke="${CI}" stroke-width="5"/>
<g clip-path="url(#c)"><svg x="21" y="21" width="318" height="395" viewBox="0 0 320 464" preserveAspectRatio="xMidYMid slice">${a.scene}</svg></g>
<rect x="19.5" y="19.5" width="321" height="398" rx="19" fill="none" stroke="${CI}" stroke-width="3"/>
<rect x="33" y="336" width="294" height="68" rx="34" fill="rgba(255,255,255,0.85)" stroke="${CI}" stroke-width="3"/>
${corners}
<g transform="translate(162 -20) scale(0.9)"><path class="ink" fill="${a.gem}" d="M20 3 L35 20 L20 37 L5 20 Z"/><path fill="#FFFFFF" opacity="0.55" d="M20 8 L20 20 L10 20 Z"/></g>
<rect x="${px}" y="${ART_H - 10}" width="${pw}" height="24" rx="12" fill="${a.frame}" stroke="${CI}" stroke-width="3"/>${pips}
</svg>`;
}
// Rasterize each background once at 2x card size, so drawing a card each frame stays cheap.
const CARD_ART = RARITY_ART.map((_, r) => {
  const slot = { ready: false, canvas: null };
  const img = new Image();
  img.onload = () => {
    const k = 2 * 112 / ART_W, c = document.createElement("canvas");
    c.width = Math.round(ART_W * k); c.height = Math.round((ART_H + ART_PAD * 2) * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    slot.canvas = c; slot.ready = true;
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(cardSvg(r));
  return slot;
});

const SPRITES = {};
for (const [el, src] of Object.entries(SPRITE_SRC)) {
  const img = new Image(), slot = { img, ready: false };
  img.onload = () => { slot.ready = true; };
  img.src = src;
  SPRITES[el] = slot;
}
// Which sprite sheet a card of this element and rarity uses ("fire", "fire2", "fire3").
function spriteKey(el, rarity) { return rarity >= 2 ? el + "3" : rarity === 1 ? el + "2" : el; }
// Draws one animated element emblem centered at (x, y), `size` px wide. Returns false if there is none.
function drawSprite(el, x, y, size, t, rarity = 0) {
  let s = SPRITES[spriteKey(el, rarity)];
  if (!s || !s.ready) s = SPRITES[el];
  if (!s || !s.ready) return false;
  const f = Math.floor(t * SPRITE_FPS) % SPRITE_FRAMES;
  ctx.drawImage(s.img, f * SPRITE_SIZE, 0, SPRITE_SIZE, SPRITE_SIZE, x - size / 2, y - size / 2, size, size);
  return true;
}

// ------------------------------------------------------------ Entities
class Card {
  constructor(el, r) {
    this.element = el; this.rarity = r; this.seed = Math.random() * 100; this.cooldown = Math.random() * 0.5;
    this.x = 0; this.y = 0; this.hx = 0; this.hy = 0; this.t = 0; this.kick = 0; this.shake = 0; this.scale = 1;
    this.inShop = false; this.price = 0; this.isFree = false; this.affordable = true; this.dragging = false;
  }
  setHome(x, y, snap) { this.hx = x; this.hy = y; if (snap) { this.x = x; this.y = y; } }
  update(dt) {
    this.t += dt; this.kick = Math.max(0, this.kick - dt * 5); this.shake = Math.max(0, this.shake - dt * 3);
    this.scale += (1 - this.scale) * Math.min(1, dt * 8);
    if (!this.dragging) { const k = Math.min(1, dt * 16); this.x = lerp(this.x, this.hx, k); this.y = lerp(this.y, this.hy, k); }
  }
  draw() {
    const d = EL[this.element], t = this.t, rc = RARITY_COLORS[this.rarity];
    ctx.save();
    ctx.translate(this.x + Math.sin(t * 60) * 6 * this.shake, this.y - 8 * this.kick - (this.dragging ? 6 : 0));
    ctx.scale(this.scale, this.scale);
    const hw = CARD_W / 2, hh = CARD_H / 2;
    if (this.rarity >= 3) {
      const pulse = 0.5 + 0.5 * Math.sin(t * 3);
      for (let i = 0; i < 3; i++) { const g = 4 + i * 4 + pulse * 3; rrect(-hw - g, -hh - g, CARD_W + g * 2, CARD_H + g * 2, 18); ctx.fillStyle = hexA(rc, 0.13 - i * 0.03); ctx.fill(); }
    }
    // Card background for this rarity (falls back to a plain frame until the art has loaded).
    const art = CARD_ART[this.rarity], k = CARD_W / ART_W;
    rrect(-hw + 3, -hh + 5, CARD_W, CARD_H, 9); ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fill();
    if (art.ready) {
      ctx.drawImage(art.canvas, -hw, -hh - ART_PAD * k, CARD_W, (ART_H + ART_PAD * 2) * k);
    } else {
      rrect(-hw, -hh, CARD_W, CARD_H, 9); ctx.fillStyle = rc; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
      rrect(-hw + 7, -hh + 7, CARD_W - 14, CARD_H - 14, 6); ctx.fillStyle = PARCH; ctx.fill();
    }
    // The elemental spirit.
    const cx = 0, cy = -6 + Math.sin(t * 2.2 + this.seed) * 3, r = 26;
    circle(cx, cy, r * 1.45, hexA(d.color, 0.18));
    if (drawSprite(this.element, cx, cy, 66, t + this.seed, this.rarity)) {
      // Base elements use the animated "Main element v1" emblems.
    } else {
    circle(cx, cy, r * 1.2, hexA(d.color, 0.18));
    poly(radialPoly(cx, cy, r, d.shape, t, this.seed), d.color, INK, 3);
    this.accents(cx, cy, r, d);
    circle(cx - r * 0.45, cy - r * 0.5, r * 0.18, "rgba(255,255,255,0.45)");
    const blink = ((t + this.seed) % 3.7) < 0.12;
    const lx = Math.sin(t * 0.7 + this.seed) * 0.6, ly = -0.4;
    pieEye(cx - r * 0.36, cy - r * 0.05, r * 0.27, lx, ly, blink);
    pieEye(cx + r * 0.36, cy - r * 0.05, r * 0.27, lx, ly, blink);
    ring(cx, cy + r * 0.28, r * 0.22, INK, 2.5, 0.25, Math.PI - 0.25);
    }
    if (this.rarity >= 3) {
      for (let i = 0; i < this.rarity - 1; i++) {
        const a = t * 1.5 + i * Math.PI * 2 / (this.rarity - 1);
        const sx = cx + Math.cos(a) * 40, sy = cy + Math.sin(a) * 26, s = 3 + Math.sin(t * 5 + i) * 1.2;
        ctx.strokeStyle = "#fff6c8"; ctx.lineWidth = 1.5; ctx.beginPath();
        ctx.moveTo(sx - s, sy); ctx.lineTo(sx + s, sy); ctx.moveTo(sx, sy - s); ctx.lineTo(sx, sy + s); ctx.stroke();
      }
    }
    text(RARITY_NAMES[this.rarity].toUpperCase(), 0, -hh + 21, 10, shade(rc, -0.55), { weight: 700, outline: 4, outlineColor: "#ffffff" });
    text(d.name, 0, hh - 16, 16, CI, { weight: 700 });
    if (this.inShop) {
      const ty = hh + 4;
      rrect(-34, ty - 13, 68, 26, 13);
      ctx.fillStyle = this.isFree ? "#6cc56a" : (this.affordable ? GOLD : "#c46a5a"); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
      text(this.isFree ? "FREE" : `${this.price} g`, 0, ty + 6, 17, INK, { weight: 700 });
    }
    ctx.restore();
  }
  accents(cx, cy, r, d) {
    const t = this.t;
    if (d.shape === "swirl") {
      for (let i = 0; i < 3; i++) { const a = t * 2 + i * Math.PI * 2 / 3; ring(cx, cy, r * 1.25, hexA(INK, 0.6), 2, a, a + 1.1); }
    } else if (d.shape === "leaf") {
      const tx = cx, ty = cy - r;
      poly([[tx, ty], [tx - 12, ty - 10], [tx - 2, ty - 16], [tx, ty - 6], [tx + 2, ty - 16], [tx + 12, ty - 10]], shade(d.color, 0.25), INK, 2);
    } else if (d.shape === "rock") {
      ctx.strokeStyle = hexA(INK, 0.6); ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(cx - r * 0.6, cy + r * 0.55); ctx.lineTo(cx - r * 0.2, cy + r * 0.75);
      ctx.moveTo(cx + r * 0.6, cy - r * 0.6); ctx.lineTo(cx + r * 0.3, cy - r * 0.8); ctx.stroke();
    } else if (d.shape === "spiky") {
      for (const s of [-1, 1]) poly([[cx + s * r * 0.8, cy], [cx + s * r * 1.7, cy - r * 0.5 + Math.sin(t * 8) * 4], [cx + s * r * 1.4, cy + r * 0.2]], shade(d.color, -0.1), INK, 2);
    }
  }
}

const stageNum = w => Math.floor((Math.max(1, w) - 1) / 10) + 1;

// look: how the enemy is drawn. resist: element it shrugs off (and its counter hits it harder).
const KINDS = {

  mummy:       { name: "Mummy", look: "mummy", heavy: true, hp: 120, speed: 22, size: 26, gold: 3, dps: 10, color: "#e8dcc0" },
  orc:         { name: "Orc", look: "orc", hp: 70, speed: 40, size: 26, gold: 2, dps: 10, color: "#7d9a5c" },
  kingOrc:     { name: "King Orc", look: "orc", king: true, boss: true, hp: 1200, speed: 15, size: 54, gold: 40, dps: 40, color: "#6a8a4a" },
  darkSlime:   { name: "Dark Slime", look: "slime", hp: 60, speed: 38, size: 22, gold: 2, dps: 8, color: "#5a4382" },
  redSlime:    { name: "Glowy Red Slime", look: "slime", glow: true, resist: "fire", hp: 45, speed: 72, size: 20, gold: 2, dps: 7, color: "#ff4f5e" },
  blueSlime:   { name: "Glowy Blue Slime", look: "slime", glow: true, resist: "water", hp: 60, speed: 46, size: 22, gold: 2, dps: 8, color: "#4fb8ff" },
  purpleSlime: { name: "Glowy Purple Slime", look: "slime", glow: true, heavy: true, resist: "wind", hp: 100, speed: 30, size: 27, gold: 3, dps: 11, color: "#b36bff" },
  kingSlime:   { name: "King Slime", look: "slime", king: true, boss: true, hp: 1500, speed: 14, size: 58, gold: 50, dps: 50, color: "#8a4fe0" },
};
class Enemy {
  constructor(kind, wave, x, y) {

    this.flying = false; this.color = d.color; this.resist = d.resist || "";
    this.dead = false; this.t = Math.random() * 10; this.flash = 0;
    this.burnDps = 0; this.burnT = 0; this.slowMult = 1; this.slowT = 0; this.rootT = 0; this.attacking = false;

  update(dt) {

    if (this.burnT > 0) { this.burnT -= dt; this.takeDamage(this.burnDps * dt); if (this.dead) return; }

    if (this.rootT > 0) this.rootT -= dt;

  draw() {

    const body = this.slowT > 0 ? mixHex(this.color, "#9fdcff", 0.45) : this.color;

    else if (this.look === "goblin") this.drawGoblin(s, t, cy, body);
    else if (this.look === "mummy") this.drawMummy(s, t, cy, body);

    if (this.rootT > 0) for (let i = 0; i < 4; i++) ring((i - 1.5) * s * 0.5, s * 0.75, s * 0.25, "#3e9b48", 3, Math.PI, Math.PI * 2);

  face(x, y, r, look = 0.6, white = "#fffaf0", angry = true) {

  }
  drawCrown(s, y) {
    const w = s * 0.55;

  drawSlime(s, t, body) {

    ctx.beginPath(); ctx.moveTo(-s * 1.05, s * 0.6);

    ctx.quadraticCurveTo(s * 1.1, -s * 0.95, s * 1.05, s * 0.6);

    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, cy + s * 0.15, s * 1.15, s * 0.62, 0, 0, Math.PI * 2); ctx.stroke();

    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(0, cy + s * 0.12, s * 0.36, s * 0.24, 0, 0, Math.PI * 2); ctx.stroke();
    circle(-s * 0.12, cy + s * 0.12, s * 0.06, INK); circle(s * 0.12, cy + s * 0.12, s * 0.06, INK);
    for (const sd of [-1, 1]) poly([[sd * s * 0.3, cy + s * 0.28], [sd * s * 0.55, cy - s * 0.05], [sd * s * 0.42, cy + s * 0.32]], "#fffaf0", INK, 1.5);
  }
  drawGoblin(s, t, cy, body) {

    for (const sd of [-1, 1]) poly([[sd * s * 0.45, cy - s * 0.4], [sd * s * 1.35, cy - s * 0.75], [sd * s * 0.55, cy - s * 0.05]], shade(body, -0.1), INK, 2.5);
    circle(0, cy - s * 0.3, s * 0.62, body); ring(0, cy - s * 0.3, s * 0.62, INK, 3);
    this.face(0, cy - s * 0.42, s * 0.15, 0.6, "#fff6a8");
    poly([[-s * 0.08, cy - s * 0.3], [0, cy - s * 0.05], [s * 0.12, cy - s * 0.28]], shade(body, -0.2), INK, 1.5);
    ring(0, cy - s * 0.1, s * 0.24, INK, 2.5, 0.35, Math.PI - 0.35);

}

class Projectile {
  constructor(el, r, x, y, target) {
    const d = EL[el];
    this.element = el; this.rarity = r; this.x = x; this.y = y; this.target = target;
    this.tx = target.x; this.ty = target.y; this.speed = d.speed || 650; this.color = d.color;
    this.pierce = d.pierce || 0; this.homing = this.pierce === 0;
    this.radius = 7 + r * 1.2 + (d.shape === "rock" ? 4 : 0);
    const len = Math.hypot(this.tx - x, this.ty - y) || 1;
    this.vx = (this.tx - x) / len * this.speed; this.vy = (this.ty - y) / len * this.speed;
    this.hit = new Set(); this.trail = []; this.life = 3; this.dead = false;
  }
  update(dt) {
    this.life -= dt; if (this.life <= 0) { this.dead = true; return; }
    this.trail.unshift([this.x, this.y]); if (this.trail.length > 7) this.trail.pop();
    if (this.homing) {
      const alive = this.target && !this.target.dead;
      if (alive) { this.tx = this.target.x; this.ty = this.target.y; }
      const dx = this.tx - this.x, dy = this.ty - this.y, l = Math.hypot(dx, dy);
      if (l <= this.speed * dt + 6) {
        this.x = this.tx; this.y = this.ty; this.dead = true;
        applyHit(this.element, this.rarity, this.x, this.y, alive ? this.target : null); return;
      }
      this.x += dx / l * this.speed * dt; this.y += dy / l * this.speed * dt;
    } else {
      this.x += this.vx * dt; this.y += this.vy * dt;
      for (const e of enemies.slice()) {
        if (this.hit.has(e) || e.dead) continue;
        if (Math.hypot(e.x - this.x, e.y - this.y) < e.size + this.radius) {
          this.hit.add(e); applyHit(this.element, this.rarity, this.x, this.y, e);
          if (--this.pierce < 0) { this.dead = true; return; }
        }
      }
      if (this.y < 60 || this.x < -40 || this.x > 760) this.dead = true;
    }
  }
  draw() {
    const n = this.trail.length;
    for (let i = 0; i < n; i++) { const k = 1 - i / n; circle(this.trail[i][0], this.trail[i][1], this.radius * (0.4 + 0.5 * k), hexA(this.color, 0.35 * k)); }
    circle(this.x, this.y, this.radius * 1.6, hexA(this.color, 0.25));
    circle(this.x, this.y, this.radius, this.color);
    ring(this.x, this.y, this.radius, INK, 2);
    circle(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.35, "rgba(255,255,255,0.7)");
  }
}

class Zone {
  constructor(x, y, radius, dps, duration, color) {
    Object.assign(this, { x, y, radius, dps, duration, color, slowAmt: 0, burnAmt: 0, t: 0, dead: false });
  }
  update(dt) {
    this.t += dt; if (this.t >= this.duration) { this.dead = true; return; }
    for (const e of enemies.slice()) {
      if (e.dead) continue;
      if (Math.hypot(e.x - this.x, e.y - this.y) <= this.radius + e.size * 0.5) {
        e.takeDamage(this.dps * dt);
        if (this.slowAmt > 0 && !e.dead) e.slow(this.slowAmt, 0.3);
        if (this.burnAmt > 0 && !e.dead) e.burn(this.burnAmt, 1);
      }
    }
  }
  draw() {
    const fade = 1 - this.t / this.duration, grow = Math.min(1, this.t * 6);
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI * 2 / 6 + this.t * 0.8;
      circle(this.x + Math.cos(a) * this.radius * 0.45 * grow, this.y + Math.sin(a) * 0.6 * this.radius * 0.45 * grow, this.radius * 0.55 * grow, hexA(this.color, 0.22 * fade));
    }
    circle(this.x, this.y, this.radius * 0.6 * grow, hexA(this.color, 0.25 * fade));
  }
}

class Fx {
  constructor(mode, opt) { Object.assign(this, { mode, t: 0, dead: false, duration: 0.4, color: "#ffffff", radius: 40, x: 0, y: 0 }, opt); }
  update(dt) { this.t += dt; if (this.t >= this.duration) this.dead = true; if (this.mode === "text") this.y -= 45 * dt; }
  draw() {
    const k = this.t / this.duration;
    if (this.mode === "burst") {
      const r = this.radius * (0.3 + 0.7 * k);
      ring(this.x, this.y, r, hexA(this.color, 1 - k), 5 * (1 - k) + 1);
      ctx.beginPath();
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.moveTo(this.x + Math.cos(a) * r * 0.6, this.y + Math.sin(a) * r * 0.6); ctx.lineTo(this.x + Math.cos(a) * r * 1.1, this.y + Math.sin(a) * r * 1.1); }
      ctx.strokeStyle = hexA(this.color, 1 - k); ctx.lineWidth = 2.5; ctx.stroke();
    } else if (this.mode === "bolt") {
      const jag = [];
      for (let i = 0; i < this.points.length - 1; i++) {
        const a = this.points[i], b = this.points[i + 1];
        jag.push(a);
        const nx = -(b[1] - a[1]), ny = b[0] - a[0], nl = Math.hypot(nx, ny) || 1;
        for (let j = 1; j < 4; j++) { const o = rand(-12, 12); jag.push([lerp(a[0], b[0], j / 4) + nx / nl * o, lerp(a[1], b[1], j / 4) + ny / nl * o]); }
      }
      jag.push(this.points[this.points.length - 1]);
      for (const [w, c] of [[7, hexA(this.color, 1 - k)], [2.5, `rgba(255,255,255,${1 - k})`]]) {
        ctx.beginPath(); ctx.moveTo(jag[0][0], jag[0][1]); for (const p of jag) ctx.lineTo(p[0], p[1]);
        ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineJoin = "round"; ctx.stroke();
      }
    } else if (this.mode === "text") {
      ctx.globalAlpha = 1 - k * k;
      text(this.text, this.x, this.y, this.size || 22, this.color, { weight: 700, outline: 5 });
      ctx.globalAlpha = 1;
    }
  }
}

const rows = { active: Array(SLOTS).fill(null), storage: Array(SLOTS).fill(null), shop: Array(SHOP_N).fill(null) };
let enemies = [], projectiles = [], zones = [], fxs = [];
let gold = 0, castleHp = CASTLE_MAX, wave = 0, state = "title", breakTimer = -1;
// Waves can overlap: each called wave has its own spawner. callCd is the Next Wave button cooldown.
const CALL_COOLDOWN = 5;
let spawners = [], callCd = 0, wavesCleared = 0, rerollCost = REROLL_BASE, freeCard = true;
let time = 0, wallFlash = 0, paused = false, bookOpen = false, bookScroll = 0;
let drag = null; // { card, from, index, ox, oy, px, py, moved }
let hover = null;
let banner = { text: "", color: PARCH, t: 99 };
let info = { text: "", t: 99 };
let pointer = { x: 0, y: 0 };

// Top-down paving stones on the rampart walkway.
const paving = [];
for (let y = FRONT_Y + 2, r = 0; y < WALL_Y; y += 38, r++)
  for (let x = (r % 2) * -28; x < W; x += 56)
    paving.push([x + 2, y + 2, 52, 34, ["#6f6361", "#75696a", "#6a5d58", "#7a6e69"][Math.floor(Math.random() * 4)]]);

function slotPos(row, i) {
  if (row === "active") return { x: 72 + i * 144, y: ACTIVE_Y };
  if (row === "storage") return { x: 72 + i * 144, y: STORAGE_Y };
  return { x: 80 + i * 130, y: SHOP_Y };
}
function slotAt(p) {
  for (const row of ["active", "storage", "shop"]) for (let i = 0; i < rows[row].length; i++) {
    const s = slotPos(row, i);
    if (inRect(p, { x: s.x - CARD_W / 2 - 10, y: s.y - CARD_H / 2 - 10, w: CARD_W + 20, h: CARD_H + 20 })) return [row, i];
  }
  return null;
}
function showBanner(t, c) { banner = { text: t, color: c, t: 0 }; }
function showInfo(t) { info = { text: t, t: 0 }; }

function clearBoard() {
  for (const r in rows) rows[r].fill(null);
  enemies = []; projectiles = []; zones = []; fxs = []; drag = null; spawners = []; callCd = 0;
}
function startRun() {
  clearBoard();
  gold = START_GOLD; castleHp = CASTLE_MAX; wave = 0; wavesCleared = 0; freeCard = true; rerollCost = REROLL_BASE;
  state = "break"; breakTimer = -1; paused = false; bookOpen = false;
  refreshShop();

  showInfo("Buy a card, then tap Next Wave (top left). You can call new waves before the last one ends.");
}
// Calls the next wave. It joins any waves still in progress. fromTimer skips the button cooldown.
function beginWave(fromTimer = false) {

  wave++; state = "wave"; breakTimer = -1; callCd = CALL_COOLDOWN; rerollCost = REROLL_BASE;
  const total = Math.min(6 + wave * 2, 70);
  spawners.push({ wave, left: total, total, timer: 0.6, boss: wave % 10 === 0 });
  const stacked = spawners.length > 1 ? `  (${spawners.length} waves at once!)` : "";
  const st = stageOf(wave);
  if (wave % 10 === 0) showBanner(`Wave ${waveLabel(wave)}: ${KINDS[st.boss].name.toUpperCase()}!${stacked}`, "#e0533f");
  else if (waveInStage(wave) === 1) showBanner(`Stage ${stageNum(wave)}: ${st.name}${stacked}`, GOLD);
  else showBanner(`Wave ${waveLabel(wave)}${stacked}`, PARCH);
}
function waveCleared(w) {
  const bonus = 4 + w; gold += bonus; wavesCleared++;
  if (wavesCleared > save.best) { save.best = wavesCleared; writeSave(); }
  showBanner(`Wave ${waveLabel(w)} cleared!  +${bonus} gold`, GOLD);
}
function toBreak() {
  state = "break"; breakTimer = BREAK_TIME;
  refreshShop();
}
function gameOver() {
  state = "gameover"; cancelDrag();
  if (wavesCleared > save.best) save.best = wavesCleared;
  writeSave();
}

function pickKind(wave) {
  const ws = waveInStage(wave), pool = stageOf(wave).pool.filter(p => ws >= p[2]);
  let pick = Math.random() * pool.reduce((a, p) => a + p[1], 0);
  for (const p of pool) { pick -= p[1]; if (pick <= 0) return p[0]; }
  return pool[0][0];
}
function spawnEnemy(kind, wave) {
  const e = new Enemy(kind, wave, rand(80, W - 80), HUD_H + 20);
  e.wave = wave; enemies.push(e);
}
function damageCastle(a) {
  if (state !== "wave") return;
  castleHp -= a; wallFlash = 1;
  if (castleHp <= 0) { castleHp = 0; gameOver(); }
}
function onEnemyKilled(e) {
  enemies = enemies.filter(x => x !== e);
  gold += e.gold;
  fxs.push(new Fx("text", { x: e.x, y: e.y - 20, text: `+${e.gold}`, color: GOLD, size: 22, duration: 0.8 }));
  fxs.push(new Fx("burst", { x: e.x, y: e.y, color: shade(e.color, 0.3), radius: e.size * 1.6, duration: 0.35 }));
}

// ------------------------------------------------------------ Combat
// Nearest living enemies to a point (the attacking card).
function closestTo(x, y, n) {
  const d = e => (e.x - x) ** 2 + (e.y - y) ** 2;
  return enemies.filter(e => !e.dead).sort((a, b) => d(a) - d(b)).slice(0, n);
}
function fireCard(c) {
  const d = EL[c.element], shots = d.multishot || 1, targets = closestTo(c.x, c.y - 60, shots);
  if (!targets.length) return;
  c.kick = 1;
  const ox = c.x, oy = c.y - 60;
  if (d.chain) { chain(c.element, c.rarity, ox, oy, targets[0], d.chain); return; }
  for (let i = 0; i < shots; i++) projectiles.push(new Projectile(c.element, c.rarity, ox + (i - (shots - 1) / 2) * 14, oy, targets[i % targets.length]));
}
function chain(el, r, ox, oy, first, count) {
  const dmg = damageOf(el, r), hit = new Set(), pts = [[ox, oy]];
  let cur = first;
  for (let i = 0; i < count && cur; i++) {
    hit.add(cur); pts.push([cur.x, cur.y]);
    hitEnemy(cur, el, r, dmg * Math.pow(0.85, i));
    let best = null, bd = 190;
    for (const e of enemies) { if (hit.has(e) || e.dead) continue; const dd = Math.hypot(e.x - pts[pts.length - 1][0], e.y - pts[pts.length - 1][1]); if (dd < bd) { bd = dd; best = e; } }
    cur = best;
  }
  fxs.push(new Fx("bolt", { points: pts, color: EL[el].color, duration: 0.18 }));
}
function applyHit(el, r, x, y, enemy) {
  const d = EL[el], dmg = damageOf(el, r), splash = d.splash || 0, rm = RARITY_DMG[r];
  if (splash > 0) {
    for (const e of enemies.slice()) if (!e.dead && Math.hypot(e.x - x, e.y - y) <= splash + e.size) hitEnemy(e, el, r, e === enemy ? dmg : dmg * 0.6);
    fxs.push(new Fx("burst", { x, y, color: d.color, radius: splash, duration: 0.35 }));
  } else if (enemy && !enemy.dead) {
    hitEnemy(enemy, el, r, dmg);
    fxs.push(new Fx("burst", { x, y, color: d.color, radius: 22, duration: 0.35 }));
  }
  if (d.cloud) zones.push(new Zone(x, y, d.cloud, d.cloud_dps * rm, 2.5, d.color));
  if (d.puddle) { const z = new Zone(x, y, d.puddle, d.puddle_dps * rm, 3, d.color); z.burnAmt = 2 * rm; zones.push(z); }
}
function hitEnemy(e, el, r, dmg) {
  const d = EL[el], mult = elementMult(el, e.resist, e.flying), amount = dmg * mult, rm = RARITY_DMG[r];
  const x = e.x, y = e.y;
  if (d.burn) e.burn(d.burn * rm, 2.5);
  if (d.slow) e.slow(d.slow, 2);
  if (d.root) e.root(d.root);
  if (d.knock) e.knock(d.knock);
  e.takeDamage(amount);
  const col = mult > 1.01 ? "#ffe34a" : mult < 0.99 ? "#a89878" : PARCH;
  fxs.push(new Fx("text", { x: x + rand(-14, 14), y: y - 30, text: String(Math.round(amount)), color: col, size: 18, duration: 0.8 }));
}

// ------------------------------------------------------------ Shop & merging
function refreshShop() {
  for (let i = 0; i < SHOP_N; i++) {
    const el = randomBase();
    const c = new Card(el, Math.min(maxRarity(el), rollRarity(Math.max(1, wave + 1))));
    c.inShop = true; c.price = priceOf(c.element, c.rarity);
    const s = slotPos("shop", i); c.setHome(s.x, s.y, true); c.y += 200;
    rows.shop[i] = c;
  }
}
function reroll() {
  if (state !== "break" && state !== "wave") return;
  if (gold < rerollCost) { showInfo("Not enough gold to reroll."); return; }
  gold -= rerollCost; rerollCost++; refreshShop();
}
function cardName(c) { return `${RARITY_NAMES[c.rarity]} ${EL[c.element].name}`; }
function firstFree() {
  for (const row of ["active", "storage"]) for (let i = 0; i < SLOTS; i++) if (!rows[row][i]) return [row, i];
  return null;
}
function buy(si, row, i) {
  const card = rows.shop[si]; if (!card) return false;
  const cost = freeCard ? 0 : card.price;
  if (gold < cost) { showInfo(`Not enough gold! This card costs ${cost}.`); card.shake = 1; return false; }
  const other = rows[row][i];
  if (!other) {
    rows.shop[si] = null; rows[row][i] = card; card.inShop = false;
    const s = slotPos(row, i); card.setHome(s.x, s.y);
  } else {
    const res = merge(card.element, card.rarity, other.element, other.rarity);
    if (!res) { showInfo(mergeHint(card, other) || `${cardName(card)} can't fuse with ${cardName(other)}.`); card.shake = 1; return false; }
    rows.shop[si] = null; applyMerge(other, res);
  }
  gold -= cost; freeCard = false; return true;
}
function sell(row, i) {
  const c = rows[row][i], v = sellOf(c.element, c.rarity);
  gold += v; rows[row][i] = null;
  fxs.push(new Fx("text", { x: c.x, y: c.y, text: `+${v} g`, color: GOLD, size: 24, duration: 0.8 }));
}
function applyMerge(card, res) {
  const changed = res.element !== card.element;
  card.element = res.element; card.rarity = res.rarity; card.cooldown = 0.3; card.scale = 1.35;
  const col = EL[res.element].color;
  fxs.push(new Fx("burst", { x: card.hx, y: card.hy, color: col, radius: 90, duration: 0.35 }));
  fxs.push(new Fx("burst", { x: card.hx, y: card.hy, color: GOLD, radius: 60, duration: 0.35 }));
  if (EL[res.element].tier > 1 && discover(res.element)) showBanner(`FUSION!  ${EL[res.element].name} discovered!`, shade(col, 0.2));
  else fxs.push(new Fx("text", { x: card.hx, y: card.hy - 80, text: changed ? "Fusion!" : `${RARITY_NAMES[res.rarity]}!`, color: changed ? shade(col, 0.3) : RARITY_COLORS[res.rarity], size: 26, duration: 0.8 }));
  showInfo(describe(card.element, card.rarity));
}
function moveCard(fr, fi, tr, ti) {
  if (fr === tr && fi === ti) return "";
  const card = rows[fr][fi], other = rows[tr][ti];
  if (!card) return "";
  if (!other) { rows[fr][fi] = null; rows[tr][ti] = card; const s = slotPos(tr, ti); card.setHome(s.x, s.y); return "move"; }
  const res = merge(card.element, card.rarity, other.element, other.rarity);
  if (res) { rows[fr][fi] = null; applyMerge(other, res); return "merge"; }
  const hint = mergeHint(card, other);
  if (hint) showInfo(hint);
  rows[fr][fi] = other; rows[tr][ti] = card;
  const a = slotPos(fr, fi), b = slotPos(tr, ti); other.setHome(a.x, a.y); card.setHome(b.x, b.y);
  return "swap";
}
function cancelDrag() { if (drag) { drag.card.dragging = false; } drag = null; hover = null; }

// ------------------------------------------------------------ Buttons
function makeBtn(label, x, y, w, h, onTap, size = 26) { return { label, x, y, w, h, onTap, size, down: false }; }
const btn = {
  book: makeBtn("Book", 466, 9, 120, 54, () => openBook()),
  pause: makeBtn("II", 600, 9, 106, 54, () => { cancelDrag(); paused = true; }),
  next: makeBtn("Next Wave", 14, HUD_H + 14, 230, 60, () => beginWave(), 24),
  reroll: makeBtn("Reroll", 450, 1100, 250, 96, () => reroll(), 28),
  play: makeBtn("Play", 180, 560, 360, 90, () => startRun(), 38),
  titleBook: makeBtn("Spellbook", 180, 670, 360, 76, () => openBook()),
  resume: makeBtn("Resume", 180, 560, 360, 80, () => { paused = false; }),
  pauseBook: makeBtn("Spellbook", 180, 660, 360, 80, () => openBook()),
  quit: makeBtn("Quit to Title", 180, 760, 360, 80, () => { paused = false; state = "title"; clearBoard(); }),
  again: makeBtn("Play Again", 180, 700, 360, 86, () => startRun()),
  title: makeBtn("Title", 180, 806, 360, 76, () => { state = "title"; clearBoard(); }),
  closeBook: makeBtn("Close", 240, 1078, 240, 70, () => { bookOpen = false; }),
};
function openBook() { cancelDrag(); bookOpen = true; bookScroll = 0; }
function visibleButtons() {
  if (bookOpen) return [btn.closeBook];
  if (state === "title") return [btn.play, btn.titleBook];
  if (state === "gameover") return [btn.again, btn.title];
  if (paused) return [btn.resume, btn.pauseBook, btn.quit];
  const list = [btn.book, btn.pause, btn.reroll];
  if (!drag) list.push(btn.next);
  return list;
}
function drawBtn(b, disabled = false) {
  const press = b.down ? 3 : 0;
  rrect(b.x, b.y + 4, b.w, b.h, 16); ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fill();
  rrect(b.x, b.y + press, b.w, b.h, 16);
  ctx.fillStyle = disabled ? "#8c7f6c" : (b.down ? "#cfb486" : "#e9d3a6"); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();

  lines.forEach((ln, i) => text(ln, b.x + b.w / 2, b.y + press + b.h / 2 + (i - (lines.length - 1) / 2) * lh, b.size, disabled ? hexA(INK, 0.6) : INK, { weight: 600, baseline: "middle" }));

// ------------------------------------------------------------ Input
function toLogical(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
}
let bookDrag = null;
canvas.addEventListener("pointerdown", ev => {
  ev.preventDefault();
  canvas.setPointerCapture?.(ev.pointerId);
  const p = toLogical(ev); pointer = p;
  for (const b of visibleButtons()) {
    if (inRect(p, b)) {
      if (b === btn.reroll && gold < rerollCost) { showInfo("Not enough gold to reroll."); return; }
      b.down = true; setTimeout(() => { b.down = false; }, 120); b.onTap(); return;
    }
  }
  if (bookOpen) { bookDrag = { y: p.y, s: bookScroll }; return; }
  if (paused || (state !== "wave" && state !== "break")) return;
  const s = slotAt(p);
  if (!s || !rows[s[0]][s[1]]) return;
  const card = rows[s[0]][s[1]];
  drag = { card, from: s[0], index: s[1], ox: card.x - p.x, oy: card.y - p.y, px: p.x, py: p.y, moved: false };
  card.dragging = true;
  showInfo(describe(card.element, card.rarity));
});
canvas.addEventListener("pointermove", ev => {
  const p = toLogical(ev); pointer = p;
  if (bookOpen && bookDrag) { bookScroll = bookDrag.s - (p.y - bookDrag.y); return; }
  if (!drag) return;
  drag.card.x = p.x + drag.ox; drag.card.y = p.y + drag.oy;
  if (Math.hypot(p.x - drag.px, p.y - drag.py) > 12) drag.moved = true;
  hover = slotAt(p);
});
function pointerUp(ev) {
  const p = toLogical(ev); pointer = p; bookDrag = null;
  if (!drag) return;
  const d = drag; cancelDrag();
  if (!d.moved) {
    if (d.from === "shop") {
      const slot = firstFree();
      if (!slot) { showInfo("No free slot! Drag it onto a matching card to fuse it."); d.card.shake = 1; }
      else buy(d.index, slot[0], slot[1]);
    }
    return;
  }
  const target = slotAt(p);
  if (d.from === "shop") { if (target && target[0] !== "shop") buy(d.index, target[0], target[1]); return; }
  if (!target || target[0] === "shop") { if (inRect(p, SELL_HIT)) sell(d.from, d.index); return; }
  moveCard(d.from, d.index, target[0], target[1]);
}
canvas.addEventListener("pointerup", pointerUp);
canvas.addEventListener("pointercancel", () => { cancelDrag(); bookDrag = null; });

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { if (bookOpen) bookOpen = false; else if (state === "wave" || state === "break") paused = !paused; }
});

// ------------------------------------------------------------ Update
function update(dt) {
  time += dt;
  banner.t += dt; info.t += dt;
  for (const r in rows) for (const c of rows[r]) if (c) c.update(dt);
  if (paused || bookOpen || state === "title" || state === "gameover") return;
  wallFlash = Math.max(0, wallFlash - dt * 3);
  callCd = Math.max(0, callCd - dt);
  if (state === "wave") {
    for (const sp of spawners) {
      sp.timer -= dt;
      if (sp.timer > 0) continue;
      sp.timer = Math.max(0.28, 1.2 - sp.wave * 0.035);
      if (sp.boss && sp.left <= sp.total / 2) { sp.boss = false; spawnEnemy(stageOf(sp.wave).boss, sp.wave); }
      else if (sp.left > 0) { sp.left--; spawnEnemy(pickKind(sp.wave), sp.wave); }
    }
    for (const c of rows.active) {
      if (!c || (drag && drag.card === c)) continue;
      c.cooldown -= dt;
      if (c.cooldown <= 0 && enemies.length) { fireCard(c); c.cooldown = 1 / rateOf(c.element, c.rarity); }
    }
  } else if (state === "break" && breakTimer > 0) {
    breakTimer -= dt; if (breakTimer <= 0) beginWave(true);
  }
  for (const e of enemies.slice()) e.update(dt);
  for (const z of zones) z.update(dt);
  for (const p of projectiles) p.update(dt);
  for (const f of fxs) f.update(dt);
  projectiles = projectiles.filter(p => !p.dead); zones = zones.filter(z => !z.dead); fxs = fxs.filter(f => !f.dead);
  if (state === "wave") {
    for (const sp of spawners.slice()) {
      if (sp.left <= 0 && !sp.boss && !enemies.some(e => e.wave === sp.wave)) { spawners.splice(spawners.indexOf(sp), 1); waveCleared(sp.wave); }
    }
    if (spawners.length === 0 && enemies.length === 0) toBreak();
  }
  for (const c of rows.shop) if (c) { c.isFree = freeCard; c.affordable = freeCard || gold >= c.price; }
}

// ------------------------------------------------------------ Render
function slotFrame(x, y, col) {
  rrect(x - CARD_W / 2, y - CARD_H / 2, CARD_W, CARD_H, 12);
  ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
}
// ------------------------------------------------------------ Stage backgrounds (top-down, like the castle)
// Flat ground seen from above. Decorations are placed once; crystals in the cave stay along the side walls.
const FIELD_T = HUD_H, FIELD_B = FRONT_Y - 8;
const seeded = n => Array.from({ length: n }, () => [Math.random(), Math.random(), Math.random()]);
const DECOR = {
  patches: seeded(18), tufts: seeded(70), flowers: seeded(26), bushes: seeded(5), stones: seeded(8),
  ripples: seeded(22), pebbles: seeded(40), cacti: seeded(5), bones: seeded(3),
  cracks: seeded(12), rubble: seeded(40),
  crystals: Array.from({ length: 12 }, (_, i) => [i % 2 ? 0.94 + Math.random() * 0.05 : 0.01 + Math.random() * 0.05, (i + Math.random()) / 12, Math.random()]),

const FLOWER_COLORS = ["#ffffff", "#ffd35a", "#ff8ac2", "#b9a3ff"];
const CRYSTAL_COLORS = ["#6ff3ff", "#b77bff", "#ff7ad9"];
const fx = k => k * W, fy = k => FIELD_T + k * (FIELD_B - FIELD_T);
function drawBgGrass() {
  ctx.fillStyle = "#5fae4f"; ctx.fillRect(0, FIELD_T, W, FRONT_Y - FIELD_T);
  for (const p of DECOR.patches) ellipse(fx(p[0]), fy(p[1]), 40 + p[2] * 50, 22 + p[2] * 26, p[2] > 0.5 ? "#69b858" : "#559f46");

  ctx.moveTo(W * 0.55, FIELD_T); ctx.bezierCurveTo(W * 0.25, 300, W * 0.75, 480, W * 0.45, FRONT_Y); ctx.stroke();
  ctx.strokeStyle = "#3f8a37"; ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.beginPath();
  for (const t of DECOR.tufts) { const x = fx(t[0]), y = fy(t[1]); ctx.moveTo(x - 4, y); ctx.lineTo(x - 6, y - 6); ctx.moveTo(x, y); ctx.lineTo(x, y - 8); ctx.moveTo(x + 4, y); ctx.lineTo(x + 6, y - 6); }
  ctx.stroke();
  for (const f of DECOR.flowers) {
    const x = fx(f[0]), y = fy(f[1]), c = FLOWER_COLORS[Math.floor(f[2] * 4)];
    for (let i = 0; i < 5; i++) circle(x + Math.cos(i * 1.256) * 4, y + Math.sin(i * 1.256) * 4, 3, c);
    circle(x, y, 2.5, "#ffb52e");
  }
  for (const s of DECOR.stones) { const x = fx(s[0]), y = fy(s[1]), r = 6 + s[2] * 8; ellipse(x, y, r, r * 0.8, "#a8a29a"); ring(x, y, r * 0.9, INK, 2); }
  for (const b of DECOR.bushes) {
    const x = b[0] < 0.5 ? fx(b[0] * 0.2) : fx(0.8 + b[0] * 0.2), y = fy(b[1]), r = 18 + b[2] * 10;
    for (const [dx, dy, k] of [[-0.6, 0.2, 0.7], [0.6, 0.25, 0.7], [0, -0.2, 0.85], [0, 0.3, 0.75]]) circle(x + dx * r, y + dy * r, r * k, "#3f8f3a");
    ring(x, y, r * 1.15, hexA(INK, 0.6), 2.5); circle(x - r * 0.3, y - r * 0.35, r * 0.2, "rgba(255,255,255,0.2)");
  }
}
function drawBgSand() {
  ctx.fillStyle = "#e6bc76"; ctx.fillRect(0, FIELD_T, W, FRONT_Y - FIELD_T);
  for (const p of DECOR.patches) ellipse(fx(p[0]), fy(p[1]), 50 + p[2] * 60, 24 + p[2] * 22, p[2] > 0.5 ? "#ecc684" : "#dcae66");
  // Wind ripples.
  ctx.strokeStyle = "rgba(170,110,45,0.4)"; ctx.lineWidth = 2; ctx.beginPath();
  for (const r of DECOR.ripples) { const x = fx(r[0]), y = fy(r[1]), w = 40 + r[2] * 50; ctx.moveTo(x - w, y); ctx.quadraticCurveTo(x - w / 2, y - 6, x, y); ctx.quadraticCurveTo(x + w / 2, y + 6, x + w, y); }
  ctx.stroke();
  for (const p of DECOR.pebbles) circle(fx(p[0]), fy(p[1]), 1.5 + p[2] * 3, p[2] > 0.5 ? "#b98547" : "#c99a5a");

    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    rrect(-14, -3, 28, 6, 3); ctx.fillStyle = "#f3ead6"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    for (const sx of [-14, 14]) for (const sy of [-3, 3]) { circle(sx, sy, 4, "#f3ead6"); ring(sx, sy, 4, INK, 1.5); }
    ctx.restore();
  }
  // Round cacti seen from above, kept near the sides.
  for (const c of DECOR.cacti) {
    const x = c[0] < 0.5 ? fx(0.03 + c[0] * 0.15) : fx(0.82 + c[0] * 0.15), y = fy(c[1]), r = 14 + c[2] * 8;
    circle(x, y, r, "#5aa45a"); ring(x, y, r, INK, 3);
    ctx.strokeStyle = "#3f7f40"; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * r * 0.85, y + Math.sin(a) * r * 0.85); }

}
function drawBgCave() {
  ctx.fillStyle = "#2a1f3a"; ctx.fillRect(0, FIELD_T, W, FRONT_Y - FIELD_T);
  for (const p of DECOR.patches) ellipse(fx(p[0]), fy(p[1]), 40 + p[2] * 60, 22 + p[2] * 28, p[2] > 0.5 ? "#30243f" : "#251b33");
  // Floor cracks.
  ctx.strokeStyle = "rgba(10,5,18,0.55)"; ctx.lineWidth = 2; ctx.beginPath();
  for (const c of DECOR.cracks) {
    let x = fx(c[0]), y = fy(c[1]); ctx.moveTo(x, y);
    for (let i = 0; i < 4; i++) { x += (c[2] - 0.5) * 30 + (i % 2 ? 12 : -10); y += 10 + i * 4; ctx.lineTo(x, y); }
  }
  ctx.stroke();
  for (const r of DECOR.rubble) circle(fx(r[0]), fy(r[1]), 1.5 + r[2] * 3, "#3d2f50");
  // Rock walls on both sides.
  const wall = side => {
    const pts = [];
    for (let i = 0; i <= 12; i++) { const y = FIELD_T + i * (FRONT_Y - FIELD_T) / 12; pts.push([side ? W - (34 + Math.sin(i * 1.9) * 12) : 34 + Math.sin(i * 1.9) * 12, y]); }
    poly(side ? [[W, FIELD_T], ...pts, [W, FRONT_Y]] : [[0, FIELD_T], ...pts, [0, FRONT_Y]], "#181024", INK, 3);
  };
  wall(0); wall(1);
  // Glowing crystal clusters, only along the side walls (seen from above).
  DECOR.crystals.forEach((c, i) => {
    const x = fx(c[0]), y = fy(c[1]), col = CRYSTAL_COLORS[i % 3], len = 16 + c[2] * 14;
    const pulse = 0.5 + 0.5 * Math.sin(time * 2 + i * 1.7);
    circle(x, y, len * 1.8, hexA(col, 0.10 + 0.08 * pulse));
    const toward = c[0] < 0.5 ? 0 : Math.PI;
    for (let k = -2; k <= 2; k++) {
      const a = toward + k * 0.45, l = len * (1 - Math.abs(k) * 0.18);
      ctx.save(); ctx.translate(x, y); ctx.rotate(a);
      poly([[0, -4], [l * 0.75, -5], [l, 0], [l * 0.75, 5], [0, 4]], col, INK, 2);
      poly([[2, -1], [l * 0.7, -2], [l * 0.9, 0], [2, 1]], "rgba(255,255,255,0.45)", null);
      ctx.restore();
    }
  });
}
function drawBackground() {
  const w = state === "title" ? 1 : (state === "break" ? wave + 1 : wave);
  const bg = stageOf(w).bg;
  if (bg === "sand") drawBgSand(); else if (bg === "cave") drawBgCave(); else drawBgGrass();
}

function drawWorld() {
  drawBackground();

  // Rampart walkway (seen from above) where the battle cards stand.
  ctx.fillStyle = "#4e4446"; ctx.fillRect(0, FRONT_Y, W, WALL_Y - FRONT_Y);
  for (const t of paving) { ctx.fillStyle = t[4]; ctx.fillRect(t[0], t[1], t[2], Math.min(t[3], WALL_Y - t[1])); }
  // Outer lip of the rampart, facing the enemies.
  const lip = mixHex("#8f8279", "#c4493e", wallFlash * 0.5);
  ctx.fillStyle = lip; ctx.fillRect(0, FRONT_Y - 8, W, 10);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(0, FRONT_Y - 8); ctx.lineTo(W, FRONT_Y - 8); ctx.moveTo(0, FRONT_Y + 2); ctx.lineTo(W, FRONT_Y + 2); ctx.stroke();
  // Inner courtyard (storage).
  ctx.fillStyle = "#3b2f3a"; ctx.fillRect(0, WALL_Y + WALL_H, W, SHOP_TOP - WALL_Y - WALL_H);
  ctx.strokeStyle = "rgba(0,0,0,0.12)"; ctx.lineWidth = 2; ctx.beginPath();
  for (let y = WALL_Y + WALL_H + 30; y < SHOP_TOP; y += 44) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  // Castle wall seen from above: stone top with raised merlons.
  const wallCol = mixHex("#8a7c72", "#c4493e", wallFlash * 0.5);
  ctx.fillStyle = wallCol; ctx.fillRect(0, WALL_Y, W, WALL_H);
  ctx.strokeStyle = hexA(INK, 0.3); ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(0, WALL_Y + WALL_H / 2); ctx.lineTo(W, WALL_Y + WALL_H / 2);
  for (let x = 18; x < W; x += 36) { const o = (Math.floor(x / 36) % 2) * WALL_H / 2; ctx.moveTo(x, WALL_Y + o); ctx.lineTo(x, WALL_Y + o + WALL_H / 2); }
  ctx.stroke();
  for (let x = 10; x < W; x += 72) {
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(x + 4, WALL_Y + 9, 44, 30);
    ctx.fillStyle = mixHex("#a59588", "#e07a6a", wallFlash * 0.5); ctx.fillRect(x, WALL_Y + 5, 44, 30);
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.strokeRect(x, WALL_Y + 5, 44, 30);
    ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 4, WALL_Y + 10); ctx.lineTo(x + 40, WALL_Y + 10); ctx.stroke();
  }
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(0, WALL_Y); ctx.lineTo(W, WALL_Y); ctx.moveTo(0, WALL_Y + WALL_H); ctx.lineTo(W, WALL_Y + WALL_H); ctx.stroke();

  // Rune circles under battle slots.
  for (let i = 0; i < SLOTS; i++) {
    const p = slotPos("active", i), c = rows.active[i];
    const col = c ? EL[c.element].color : GOLD, pulse = 0.5 + 0.5 * Math.sin(time * 2.5 + i);
    ctx.save(); ctx.translate(p.x, p.y + 52); ctx.scale(1, 0.3);
    circle(0, 0, 66, hexA(col, 0.12 + 0.1 * pulse));
    ring(0, 0, 62, hexA(col, 0.55 + 0.3 * pulse), 4);
    ring(0, 0, 48, hexA(col, 0.4), 3, time, time + Math.PI * 1.6);
    ctx.restore();
    slotFrame(p.x, p.y, hexA(GOLD, 0.35));
  }
  for (let i = 0; i < SLOTS; i++) { const p = slotPos("storage", i); slotFrame(p.x, p.y, hexA(PARCH, 0.25)); }
  // Shop table.
  ctx.fillStyle = "#5a3b28"; ctx.fillRect(0, SHOP_TOP, W, H - SHOP_TOP);
  ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.lineWidth = 2; ctx.beginPath();
  for (let y = SHOP_TOP + 30; y < H; y += 34) { ctx.moveTo(0, y); ctx.lineTo(W, y + 4); }
  ctx.stroke();
  ctx.fillStyle = "#8a5f3c"; ctx.fillRect(0, SHOP_TOP, W, 8);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, SHOP_TOP); ctx.lineTo(W, SHOP_TOP); ctx.stroke();
  for (let i = 0; i < SHOP_N; i++) { const p = slotPos("shop", i); slotFrame(p.x, p.y, hexA(GOLD, 0.3)); }

  // Drag hints.
  if (drag) {
    if (hover && hover[0] !== "shop") {
      const hp = slotPos(hover[0], hover[1]), other = rows[hover[0]][hover[1]];
      const ok = !other || other === drag.card || !!merge(drag.card.element, drag.card.rarity, other.element, other.rarity);
      rrect(hp.x - CARD_W / 2 - 8, hp.y - CARD_H / 2 - 8, CARD_W + 16, CARD_H + 16, 16);
      ctx.strokeStyle = ok ? "#6cc56a" : "#e0533f"; ctx.lineWidth = 4; ctx.stroke();
    }
  }

  for (const z of zones) z.draw();
  for (const e of enemies) e.draw();
  for (const r of ["active", "storage", "shop"]) for (const c of rows[r]) if (c && !c.dragging) c.draw();
  for (const p of projectiles) p.draw();
  for (const f of fxs) f.draw();
}

function drawHud() {
  ctx.fillStyle = "rgba(26,16,34,0.92)"; ctx.fillRect(0, 0, W, HUD_H);
  ctx.strokeStyle = shade(GOLD, -0.3); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, HUD_H); ctx.lineTo(W, HUD_H); ctx.stroke();
  if (state === "title") return;
  text(`Wave ${waveLabel(state === "break" ? wave + 1 : wave)}`, 16, 47, 26, PARCH, { align: "left", outline: 8 });
  // Castle HP beside the wave counter.
  const hb = { x: 186, y: 22, w: 258, h: 28 };
  const tx = 164, ty = 36;
  ctx.fillStyle = "#a59588"; ctx.fillRect(tx - 11, ty - 8, 22, 20);
  for (const mx of [-11, -3, 5]) ctx.fillRect(tx + mx, ty - 14, 6, 7);
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.strokeRect(tx - 11, ty - 8, 22, 20);
  ctx.fillStyle = INK; ctx.fillRect(tx - 3, ty + 3, 6, 9);
  ctx.fillStyle = wallFlash > 0 ? mixHex("#2a1a12", "#e0533f", wallFlash) : INK; ctx.fillRect(hb.x - 3, hb.y - 3, hb.w + 6, hb.h + 6);
  ctx.fillStyle = "#4a2a2a"; ctx.fillRect(hb.x, hb.y, hb.w, hb.h);
  ctx.fillStyle = mixHex("#e0533f", "#6cc56a", castleHp / CASTLE_MAX); ctx.fillRect(hb.x, hb.y, hb.w * castleHp / CASTLE_MAX, hb.h);
  text(`${Math.ceil(castleHp)} / ${CASTLE_MAX}`, hb.x + hb.w / 2, hb.y + 21, 19, PARCH, { outline: 5 });
  // Gold, under the left edge of the Reroll button.
  const gx = btn.reroll.x + 16, gy = btn.reroll.y + btn.reroll.h + 34;
  circle(gx, gy, 15, GOLD); ring(gx, gy, 15, INK, 3); ring(gx, gy, 9, hexA(INK, 0.5), 2);
  text(String(gold), gx + 24, gy + 11, 30, GOLD, { align: "left", outline: 8 });
  if (state === "gameover") return;
  btn.reroll.label = `Reroll\n${rerollCost} gold`;
  btn.next.label = callCd > 0 ? `Next Wave  ${Math.ceil(callCd)}s` : (state === "break" && breakTimer > 0 ? `Next Wave (${Math.ceil(breakTimer)})` : "Next Wave");
  drawBtn(btn.book); drawBtn(btn.pause); drawBtn(btn.reroll, gold < rerollCost);
  drawSellBox();
  if (!drag && !paused) {
    drawBtn(btn.next, callCd > 0);
    // Cooldown bar along the bottom of the button.
    if (callCd > 0) {
      const b = btn.next; rrect(b.x + 10, b.y + b.h - 12, (b.w - 20) * (1 - callCd / CALL_COOLDOWN), 6, 3); ctx.fillStyle = GOLD; ctx.fill();
    }
  }
  if (info.t < 4.6) {
    ctx.globalAlpha = info.t < 4 ? 1 : 1 - (info.t - 4) / 0.6;
    wrapText(info.text, W / 2, 640, 680, 20, 24);
    ctx.globalAlpha = 1;
  }
  if (banner.t < 2.2) {
    const k = Math.min(1, banner.t / 0.3), s = 0.6 + 0.4 * (1 - Math.pow(1 - k, 3)) + (k < 1 ? 0.08 * Math.sin(k * Math.PI) : 0);
    ctx.save(); ctx.globalAlpha = banner.t < 1.7 ? 1 : 1 - (banner.t - 1.7) / 0.5;
    ctx.translate(W / 2, 340); ctx.scale(s, s);

}
function drawSellBox() {
  const r = SELL_RECT, selling = drag && drag.from !== "shop";
  const over = selling && inRect(pointer, SELL_HIT);
  const pulse = 0.5 + 0.5 * Math.sin(time * 6);
  if (selling) { rrect(r.x - 6, r.y - 6, r.w + 12, r.h + 12, 18); ctx.fillStyle = hexA(GOLD, over ? 0.45 : 0.15 + 0.15 * pulse); ctx.fill(); }
  rrect(r.x, r.y + 3, r.w, r.h, 14); ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fill();
  rrect(r.x, r.y, r.w, r.h, 14); ctx.fillStyle = over ? "#d9704f" : "#b4553a"; ctx.fill();
  ctx.strokeStyle = selling ? GOLD : INK; ctx.lineWidth = selling ? 4 : 3; ctx.stroke();
  // Coin bag icon.
  const bx = r.x + 30, by = r.y + r.h / 2 + 4;
  poly([[bx - 14, by + 12], [bx - 12, by - 4], [bx - 6, by - 10], [bx + 6, by - 10], [bx + 12, by - 4], [bx + 14, by + 12]], "#e9d3a6", INK, 2.5);
  poly([[bx - 6, by - 10], [bx - 9, by - 17], [bx + 9, by - 17], [bx + 6, by - 10]], "#e9d3a6", INK, 2.5);
  circle(bx, by + 2, 6, GOLD); ring(bx, by + 2, 6, INK, 2);
  text("Sell", r.x + 80, r.y + r.h / 2 + 9, 24, PARCH, { weight: 700, outline: 5 });
}
function wrapText(s, x, y, maxW, size, lh) {
  ctx.font = `600 ${size}px ${FONT}`;
  const words = s.split(" "), lines = []; let line = "";
  for (const w of words) { const t = line ? line + " " + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  lines.forEach((ln, i) => text(ln, x, y + (i - (lines.length - 1)) * lh, size, PARCH, { outline: 6 }));
}

function dim(a) { ctx.fillStyle = `rgba(15,8,20,${a})`; ctx.fillRect(0, 0, W, H); }
function drawOverlays() {
  if (state === "title") {
    dim(0.55);
    text("ARCANE", W / 2, 300, 84, GOLD, { font: DISPLAY, weight: 900, outline: 14 });
    text("FUSION", W / 2, 390, 84, GOLD, { font: DISPLAY, weight: 900, outline: 14 });
    text("~ Merge & Defend ~", W / 2, 455, 34, PARCH, { outline: 8 });
    // A little parade of the four base spirits.
    BASE.forEach((el, i) => {
      const x = W / 2 + (i - 1.5) * 110, y = 520 + Math.sin(time * 2.4 + i) * 6, d = EL[el];
      ctx.save(); ctx.translate(0, 0);
      circle(x, y, 40, hexA(d.color, 0.2));
      if (!drawSprite(el, x, y, 72, time + i * 0.25)) {
        poly(radialPoly(x, y, 22, d.shape, time, i * 7), d.color, INK, 3);
        const bl = ((time + i) % 3.3) < 0.12;
        pieEye(x - 8, y - 1, 6, 0, -0.3, bl); pieEye(x + 8, y - 1, 6, 0, -0.3, bl);
      }
      ctx.restore();
    });
    btn.play.y = 600; btn.titleBook.y = 710;
    drawBtn(btn.play); drawBtn(btn.titleBook);
    if (save.best > 0) text(`Best: wave ${save.best}`, W / 2, 840, 26, PARCH, { outline: 8 });
    const found = RECIPE_LIST.filter(r => save.discovered[r[2]]).length;
    text(`${found} / ${RECIPE_LIST.length} fusions discovered`, W / 2, 880, 22, hexA(PARCH, 0.8), { outline: 6 });
  } else if (state === "gameover" && !bookOpen) {
    dim(0.7);
    text("The Castle", W / 2, 470, 56, "#e0533f", { font: DISPLAY, weight: 900, outline: 12 });
    text("Has Fallen!", W / 2, 540, 56, "#e0533f", { font: DISPLAY, weight: 900, outline: 12 });
    const n = wavesCleared;
    text(`You cleared ${n} wave${n === 1 ? "" : "s"}.`, W / 2, 610, 30, PARCH, { outline: 8 });
    text(`Best: ${save.best}`, W / 2, 660, 26, GOLD, { outline: 8 });
    drawBtn(btn.again); drawBtn(btn.title);
  } else if (paused && !bookOpen) {
    dim(0.6);
    text("Paused", W / 2, 480, 60, PARCH, { font: DISPLAY, weight: 900, outline: 12 });
    drawBtn(btn.resume); drawBtn(btn.pauseBook); drawBtn(btn.quit);
  }
  if (bookOpen) drawBook();
}

function bookLines() {
  const L = [];
  const found = RECIPE_LIST.filter(r => save.discovered[r[2]]).length;
  L.push({ center: true, segs: [["Spellbook of Fusions", INK, 32, DISPLAY, 900]] });
  L.push({ center: true, segs: [[`${found} / ${RECIPE_LIST.length} recipes discovered`, "#6b3a22", 22]] });
  L.push({ gap: 18 });
  L.push({ segs: [["Rules", INK, 28, DISPLAY, 900]] });
  for (const s of ["Main elements: same + same = next level.", "V1 (Common) > V2 (Uncommon) > V3 (Rare, max).",
    "Next elements: two different main elements", "of the same level (V2 Fire + V2 Earth = V2 Lava).",
    "They level up to V3 too.", "Epic elements: two different V3 next elements.",
    "Epic levels up: Epic > Myth > Legend."])
    L.push({ segs: [[s, INK, 22]] });
  L.push({ segs: RARITY_NAMES.flatMap((n, i) => [[n, shade(RARITY_COLORS[i], -0.3), 22, FONT, 700], [i < 5 ? " > " : "", INK, 22]]) });
  let lastTier = 0;
  for (const r of RECIPE_LIST) {
    const tier = EL[r[2]].tier;
    if (tier !== lastTier) { L.push({ gap: 16 }); L.push({ segs: [[tier === 2 ? "Next Elements" : "Epic Elements (V3 + V3)", INK, 28, DISPLAY, 900]] }); lastTier = tier; }
    if (save.discovered[r[2]]) {
      const c = el => shade(EL[el].color, -0.35);
      L.push({ segs: [[EL[r[0]].name, c(r[0]), 24], [" + ", INK, 24], [EL[r[1]].name, c(r[1]), 24], [" = ", INK, 24], [EL[r[2]].name, c(r[2]), 30, FONT, 700]] });
      L.push({ indent: 20, segs: [[EL[r[2]].desc, "#6b5a48", 18, FONT, 500]] });
    } else {
      L.push({ segs: [["???  +  ???  =  ???", "#8c7f6c", 24]] });
      L.push({ indent: 20, segs: [["An undiscovered fusion...", "#a89878", 18, FONT, 500]] });
    }
  }
  return L;
}
function drawBook() {
  dim(0.6);
  const bx = 30, by = 110, bw = 660, bh = 1060;
  rrect(bx, by + 10, bw, bh, 18); ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fill();
  rrect(bx, by, bw, bh, 18); ctx.fillStyle = "#6b3a22"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
  rrect(bx + 12, by + 12, bw - 24, bh - 24, 10); ctx.fillStyle = "#efdcb4"; ctx.fill();
  const top = by + 36, bottom = by + bh - 110, left = bx + 46;
  ctx.save(); ctx.beginPath(); ctx.rect(bx + 12, top - 12, bw - 24, bottom - top + 12); ctx.clip();
  const lines = bookLines();
  let total = 0; for (const l of lines) total += l.gap || Math.max(...l.segs.map(s => s[2])) * 1.4;
  bookScroll = clamp(bookScroll, 0, Math.max(0, total - (bottom - top)));
  let y = top - bookScroll;
  for (const l of lines) {
    if (l.gap) { y += l.gap; continue; }
    const lh = Math.max(...l.segs.map(s => s[2])) * 1.4; y += lh;
    let widths = l.segs.map(s => { ctx.font = `${s[4] || 600} ${s[2]}px ${s[3] || FONT}`; return ctx.measureText(s[0]).width; });
    let x = l.center ? W / 2 - widths.reduce((a, b) => a + b, 0) / 2 : left + (l.indent || 0);
    l.segs.forEach((s, i) => { text(s[0], x, y - lh * 0.25, s[2], s[1], { align: "left", font: s[3] || FONT, weight: s[4] || 600 }); x += widths[i]; });
  }
  ctx.restore();
  if (total > bottom - top) {
    const trackH = bottom - top, thumb = Math.max(60, trackH * trackH / total), pos = (bookScroll / (total - trackH)) * (trackH - thumb);
    rrect(bx + bw - 30, top + pos, 8, thumb, 4); ctx.fillStyle = hexA(INK, 0.35); ctx.fill();
  }
  drawBtn(btn.closeBook);
}

// ------------------------------------------------------------ Soft edge vignette
const vignette = (() => {
  const v = document.createElement("canvas"); v.width = W; v.height = H;
  const vc = v.getContext("2d"), g = vc.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.72);
  g.addColorStop(0, "rgba(20,10,15,0)"); g.addColorStop(1, "rgba(20,10,15,0.22)");
  vc.fillStyle = g; vc.fillRect(0, 0, W, H);
  return v;
})();
function drawFilm() {
  // Only a soft, static darkening at the edges. No grain, flicker or scratches.
  ctx.drawImage(vignette, 0, 0);
}

// ------------------------------------------------------------ Loop
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  update(dt);
  ctx.clearRect(0, 0, W, H);
  drawWorld(); drawHud();
  if (drag) {
    drag.card.draw();
    if (drag.from !== "shop" && inRect(pointer, SELL_HIT))
      text(`Sell for +${sellOf(drag.card.element, drag.card.rarity)} g`, clamp(drag.card.x, 120, W - 120), drag.card.y - CARD_H / 2 - 18, 26, GOLD, { weight: 700, outline: 6 });
  }
  drawOverlays(); drawFilm();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
