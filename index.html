<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beanery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen café diorama you can swipe and pinch. Wallet floats on top, Brew + a 4-button dock float at the bottom, sheets slide up above the dock. */
:root{
  --bg:#E9ECE6; --stage:#EEF0EA; --surface:#FFFFFF; --surface-2:#F4F5F1; --glass:rgba(255,255,255,.86); --ink:#1C201C; --muted:#687066; --line:#D9DED5;
  --accent:#2F6B55; --accent-ink:#FFFFFF; --accent-soft:#DCEAE3; --money:#94661C; --gem:#3C8DB0; --warn:#B4532A; --scrim:rgba(18,22,18,.55);
  --font-display:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121512; --stage:#171B17; --surface:#1C201C; --surface-2:#232823; --glass:rgba(28,32,28,.86); --ink:#E8ECE5; --muted:#9AA296; --line:#30372F;
    --accent:#7CC3A4; --accent-ink:#0E1A14; --accent-soft:#22362D; --money:#E3B566; --gem:#7CC4E3; --warn:#E78C64; --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121512; --stage:#171B17; --surface:#1C201C; --surface-2:#232823; --glass:rgba(28,32,28,.86); --ink:#E8ECE5; --muted:#9AA296; --line:#30372F;
  --accent:#7CC3A4; --accent-ink:#0E1A14; --accent-soft:#22362D; --money:#E3B566; --gem:#7CC4E3; --warn:#E78C64; --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{position:fixed;inset:0;overflow:hidden;background:var(--stage)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}

.top{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;gap:8px;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top > *{pointer-events:auto}
.hudrow{display:flex;gap:8px;align-items:stretch;max-width:520px;width:100%;margin:0 auto}
.wallet{flex:1;min-width:0;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:8px 12px}
.line1{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--accent)}
.money{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ratingpill{margin-left:auto}
.gems{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--gem);font-variant-numeric:tabular-nums}
.gem{width:16px;height:16px;flex:0 0 auto}
.sub{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:2px}
.sub .rate{color:var(--money);font-weight:700}
.daybar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;min-width:30px}
.daybar i{display:block;height:100%;width:0;background:var(--accent)}
.iconbtn{width:46px;border-radius:16px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:520px;width:100%;margin:0 auto;pointer-events:none}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;border:1px solid transparent;
  background:var(--money);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.chip.seatchip{background:var(--surface);color:var(--warn);border-color:var(--warn);cursor:pointer}
.chip.vip{background:var(--surface);color:var(--money);border-color:var(--money);cursor:pointer}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;pointer-events:none;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bottom > *{pointer-events:auto;max-width:520px;width:100%;margin:0 auto}
.toast{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(100% + 8px);
  max-width:520px;margin:0 auto;padding:10px 12px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.35;
  opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none!important}
.toast.show{opacity:1;transform:none}

.brew{position:relative;overflow:hidden;height:58px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;touch-action:manipulation;box-shadow:0 6px 20px rgba(20,40,30,.18)}
.brew .fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,255,255,.2)}
.brew .label{position:relative;font-family:var(--font-display);font-weight:700;font-size:17px}
.brew .hint{position:relative;font-size:12px;opacity:.85}
.brew.idle{background:var(--glass);color:var(--muted);border:1px solid var(--line);box-shadow:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.brew.pulse{animation:pulse 1.4s ease-in-out infinite}
.brew:active{transform:scale(.985)}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-soft)}}

.actrow{display:flex;gap:8px;align-items:stretch}
.actrow .brew{flex:1;min-width:0}
.phonebtn{position:relative;width:58px;flex:0 0 58px;border-radius:18px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.phonebtn svg{width:26px;height:26px}
.phonebtn .count{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
.stars{color:#D49B1F;letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.ratingpill{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-display);font-weight:700;font-size:15px;color:#C08A14;font-variant-numeric:tabular-nums}
.dock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:5px;border-radius:20px;background:var(--glass);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line)}
.dock button{position:relative;height:58px;border:0;border-radius:15px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11.5px;font-weight:700;color:var(--muted);min-width:0}
.dock button svg{width:24px;height:24px}
.dock button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dock .badge{position:absolute;top:8px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--money);border:2px solid var(--surface)}

.drawer{display:flex;flex-direction:column;max-height:min(62vh,560px);background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.18)}
.dhead{display:flex;align-items:center;gap:8px;padding:14px 14px 8px 16px}
.dhead h2{margin:0;font-family:var(--font-display);font-size:18px;flex:1}
.dclose{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center}
.subtabs{display:flex;gap:4px;margin:0 12px 8px;padding:4px;border-radius:12px;background:var(--surface-2)}
.subtabs button{flex:1;min-width:0;height:32px;border:0;border-radius:9px;background:transparent;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.subtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.panel{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 10px 10px 12px;border-radius:14px;background:var(--surface-2)}
.row.locked{opacity:.6}
.ico{width:40px;height:40px;border-radius:10px;background:var(--surface);display:grid;place-items:center}
.ico svg{width:26px;height:26px}
.info{min-width:0}
.name{font-weight:700;font-size:14.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.lvl{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.lvl.on{color:var(--accent)}
.desc{color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.buy{min-width:92px;height:44px;padding:0 10px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.buy span{font-size:11.5px;font-weight:500;opacity:.9}
.buy b{font-size:14px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.buy[disabled]{background:var(--surface);color:var(--muted);cursor:default;border:1px solid var(--line)}
.buy.gemb{background:var(--gem);color:#fff}
.buy.gemb[disabled]{background:var(--surface);color:var(--muted)}
.pair{display:flex;flex-direction:column;gap:6px}
.pair .buy{height:38px;min-width:104px}
.note{color:var(--muted);font-size:12.5px;line-height:1.4;padding:2px 4px;margin:0}
.card{padding:14px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-family:var(--font-display);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:10px;padding:8px}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stat b{font-variant-numeric:tabular-nums;font-size:14px}
.card .buy{align-self:stretch;flex-direction:row;gap:8px;height:46px}
.card .buy span{font-size:14px;font-weight:700;opacity:1}
.plain{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;cursor:pointer}

.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:end center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:440px;background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--font-display);font-size:20px;text-wrap:balance}
.sheet p{margin:0;color:var(--muted);line-height:1.45}
.sheet .big{font-family:var(--font-display);font-size:34px;font-weight:700;color:var(--money);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-direction:column;gap:8px}
.btn{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--warn)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:12px;background:var(--surface-2)}
.ad{place-items:center;background:#0E110E;color:#EDEFEA}
.phonewrap{place-items:center}
.phone{width:100%;max-width:370px;height:min(720px,calc(100vh - 40px));height:min(720px,calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));min-height:0;background:#151815;border-radius:42px;padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex}
.screen{flex:1;min-width:0;min-height:0;background:var(--surface);border-radius:33px;overflow:hidden;display:flex;flex-direction:column}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 4px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.notch{width:90px;height:22px;border-radius:12px;background:#151815}
.appbar{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.appicon{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--font-display);font-weight:700}
.appbar h2{margin:0;font-family:var(--font-display);font-size:16px;flex:1;line-height:1.2}
.appbar h2 small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted)}
.appscroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.summary{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:14px;border-radius:16px;background:var(--surface-2)}
.bignum{font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.summary .stars{font-size:15px;display:block;margin-top:4px}
.summary small{color:var(--muted);font-size:12px}
.dist{display:flex;flex-direction:column;gap:4px}
.dist div{display:grid;grid-template-columns:12px minmax(0,1fr) 28px;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dist i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.dist i b{display:block;height:100%;background:#D49B1F}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.review{padding:12px;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.rhead{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:0 0 auto}
.rname{font-weight:700;font-size:13.5px;flex:1;min-width:0}
.rname small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.review p{margin:0;font-size:13.5px;line-height:1.45}
.empty{text-align:center;color:var(--muted);padding:24px 8px;line-height:1.5}
.homebar{height:22px;display:grid;place-items:center}
.homebar button{width:120px;height:5px;border-radius:3px;border:0;background:var(--ink);opacity:.35;cursor:pointer;padding:0}
.ad .box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.ad .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.ad .title{font-family:var(--font-display);font-size:22px;font-weight:700}
.ad .bar{width:100%;height:6px;border-radius:3px;background:#2A302A;overflow:hidden}
.ad .bar i{display:block;height:100%;width:0;background:#7CC3A4}
.ad .btn{width:100%;background:#1E241E;color:#EDEFEA;border-color:#2F372F}
.ad .btn.primary{background:#7CC3A4;color:#0E1A14}
@media (prefers-reduced-motion: reduce){.brew.pulse{animation:none}.toast{transition:none}}
</style>
</head>
<body>

<div id="app">
  <canvas id="scene" aria-label="Your café. Drag to move the camera, tap to brew."></canvas>

  <div class="top" id="top">
    <div class="hudrow">
      <div class="wallet">
        <div class="line1">
          <span class="brand"><b>Beanery</b> · <span id="stageName">Coffee Stand</span></span>
          <span class="ratingpill" title="Café rating">★ <span id="ratingNum">–</span></span>
          <span class="gems" title="Gems"><svg class="gem" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h8l3 4-7 8-7-8z" fill="currentColor"/><path d="M1 6h14M5.5 6 8 14l2.5-8M4 2l1.5 4M12 2l-1.5 4" stroke="#fff" stroke-opacity=".55" fill="none"/></svg><span id="gems">0</span></span>
        </div>
        <div class="money" id="money">$0</div>
        <div class="sub"><span class="rate" id="rate">$0/min</span><span id="dayLabel">Day 1</span><div class="daybar" aria-hidden="true"><i id="dayFill"></i></div></div>
      </div>
      <button class="iconbtn" id="gear" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </button>
    </div>
    <div class="chips"><span id="boostChips" style="display:contents"></span><button class="chip vip" id="vipBtn" hidden></button><button class="chip seatchip" id="seatChip" hidden></button></div>
  </div>

  <div class="bottom" id="bottom">
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <section class="drawer" id="drawer" hidden aria-labelledby="dTitle">
      <div class="dhead"><h2 id="dTitle">Upgrade</h2><button class="dclose" id="dClose" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="subtabs" id="subtabs" role="tablist"></div>
      <div class="panel" id="panel"></div>
    </section>
    <div class="actrow" id="actrow">
      <button class="brew" id="brew"><span class="fill" id="brewFill"></span><span class="label" id="brewLabel">Brew</span><span class="hint" id="brewHint">Tap to make the next order</span></button>
      <button class="phonebtn" id="phoneBtn" aria-label="Café reviews">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10.5 18.5h3"/><path d="m12 7 1.1 2.2 2.4.3-1.7 1.7.4 2.4-2.2-1.2-2.2 1.2.4-2.4-1.7-1.7 2.4-.3z" fill="currentColor" stroke-width="1"/></svg>
        <span class="count" id="unread" hidden>0</span>
      </button>
    </div>
    <nav class="dock" id="dock">
      <button data-sec="upgrade" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16V8M8.5 11.5 12 8l3.5 3.5"/></svg>Upgrade<i class="badge" data-badge="upgrade" hidden></i></button>
      <button data-sec="decor" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14h10l-1.5 7h-7z"/><path d="M12 14V9"/><path d="M12 9c0-3 2-5 5-5 0 3-2 5-5 5zM12 11c0-2.5-1.8-4.2-4.5-4.2 0 2.5 1.8 4.2 4.5 4.2z"/></svg>Decoration<i class="badge" data-badge="decor" hidden></i></button>

function migrate(d){
  const f = freshState(), items = f.items, boosts = f.boosts;

  s.items = items;

  s.boosts = boosts;

/* ---------------- Rules ---------------- */
const has = id => !!S.deco[id];

const active = id => Date.now() < S.boosts[id].until;

const baristaSpeed = l => 1 + 0.15 * l;

const avgRating = () => S.rt.length ? S.rt.reduce((a, b) => a + b, 0) / S.rt.length : null;
// Customer flow. Upgrades set the café's base flow: 1 customer every 15s at the start.
// The rating then scales it: 5★ = 100%, 2.5★ = 50%, 1★ = 20% (rating ÷ 5). No ratings yet counts as 5★.
const BASE_GAP = 15;
const ratingMult = () => { const a = avgRating(); return a == null ? 1 : a / 5; };

const baseAppeal = () => 1 + 0.15 * decoCount() + 0.05 * Math.max(0, S.seats - 2) + 0.5 * S.stage + 0.1 * Math.max(0, menuCount() - 1);
const appeal = () => baseAppeal() * ratingMult();
const gapText = perSec => { const g = 1 / perSec; return g >= 60 ? `1 every ${(g / 60).toFixed(1)} min` : `1 every ${g.toFixed(g < 10 ? 1 : 0)}s`; };
const maxSeats = () => STAGES[S.stage].maxSeats;
const WAGE_BARISTA = 225, WAGE_CASHIER = 375;
const baristaWage = l => WAGE_BARISTA * (1 + 0.15 * l), cashierWage = () => S.cashier ? WAGE_CASHIER * (1 + 0.15 * (S.cashier - 1)) : 0;
const wages = () => S.baristas.reduce((a, l) => a + baristaWage(l), 0) + cashierWage();
const rent = () => STAGES[S.stage].rent;
const online = () => navigator.onLine !== false;
const adsAvailable = () => S.supporter || online();
const cost = {
  item: it => Math.round(Math.max(12, it.unlock * 0.6) * Math.pow(1.55, S.items[it.id].lvl)),
  machine: () => Math.round(40 * Math.pow(1.7, S.machine)),
  seat: () => Math.round(40 * Math.pow(1.38, Math.max(0, S.seats - 2))),
  hire: () => [150, 1500, 12000, 90000][S.baristas.length],
  train: i => Math.round(100 * Math.pow(1.8, S.baristas[i])),
  cashier: () => S.cashier === 0 ? 300 : Math.round(200 * Math.pow(1.8, S.cashier)),
};
function autoRatePerSec(){
  if (!S.baristas.length) return 0;
  const owned = ITEMS.filter(it => S.items[it.id].owned);
  const avg = f => owned.reduce((a, it) => a + f(it), 0) / owned.length;
  const avgPrice = avg(price) * tipMult(), avgTime = avg(prepTime);
  const capacity = S.baristas.reduce((a, l) => a + baristaSpeed(l) / avgTime, 0);
  const served = Math.min(capacity, appeal() / BASE_GAP);
  return served * avgPrice * 0.6 - (rent() + wages()) / DAY_LEN;
}
function perMinute(){
  const cut = performance.now() - 60000;
  return earnLog.reduce((a, e) => a + (e[0] >= cut ? e[1] : 0), 0);
}
function tipJarAmount(){
  const floor = [60, 600, 6000, 60000][S.stage];
  const v = Math.max(floor, perMinute() * 5, autoRatePerSec() * 300);
  const mag = Math.pow(10, Math.floor(Math.log10(v)) - 1);

/* ---------------- Formatting ---------------- */
function fmt(n){
  const neg = n < 0; let a = Math.floor(Math.abs(n));
  if (a < 1000) return (neg ? '-$' : '$') + a.toLocaleString('en-US');
  const u = ['K','M','B','T','Qa']; let i = -1, v = a;
  while (v >= 1000 && i < u.length - 1){ v /= 1000; i++; }
  return (neg ? '-$' : '$') + (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)) + u[i];
}
const fmtPrice = n => n < 100 ? '$' + n.toFixed(2) : fmt(n);
function dur(s){
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${s % 60}s`;
  return `${s}s`;
}
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

/* ---------------- Sound ---------------- */
let actx = null;

}
function tone(freq, d = .08, type = 'sine', vol = .05, delay = 0){

  o.type = type; o.frequency.setValueAtTime(freq, t);

}
const sfx = {
  coin(){ tone(988, .07, 'triangle', .05); tone(1480, .12, 'triangle', .05, .06); },
  tap(){ tone(520, .04, 'sine', .04); },
  buy(){ tone(660, .07, 'sine', .05); tone(990, .12, 'sine', .05, .07); },

/* ---------------- Room layout ---------------- */
// Room plan: counter along the back-right wall with the register at its right end.
// The line forms in front of the register. One door on the left wall. Tables fill the right side.
function layout(){
  const N = STAGES[S.stage].size, cl = 4 + S.stage, regX = cl + .5, spots = [];
  for (let ty = 3.0; ty <= N - 1.0 + 1e-6; ty += 1.9)
    for (let tx = N - 1.3; tx >= regX + 1.3 - 1e-6; tx -= 1.9) spots.push({ x:tx, y:ty });
  const dy = N - 1.6;
  L = { N, cl, regX, laneQ:regX - .75, dy, door:[.6, dy], outside:[-1.4, dy], spots, chairs:[] };
  rebuildChairs();
}
function rebuildChairs(){
  const keep = L.chairs; L.chairs = [];
  const n = Math.min(S.seats, L.spots.length * 2);
  for (let j = 0; j < n; j++){
    const s = L.spots[j >> 1], left = j % 2 === 0;
    L.chairs.push({ x:s.x + (left ? -.62 : .62), y:s.y, lane:s.x + (left ? -.95 : .95), table:j >> 1, c:keep[j]?.c || null, dirty:keep[j]?.dirty || null });
  }
}
// Waiting area for dine-in guests with no free chair: a marked zone against the left wall, 3 x 4 fixed spots.
// It is anchored to the wall, so it stays in the same place when the café grows. Spot 1 is the one nearest the line.
const WAIT_COLS = 3, WAIT_ROWS = 4, WAIT_X0 = .45, WAIT_Y0 = 2.85, WAIT_GAP = .78;
const freeChair = () => L.chairs.find(ch => !ch.c && !ch.dirty);
const dirtyCount = () => L.chairs.reduce((a, ch) => a + (ch.dirty ? 1 : 0), 0);
function cleanTable(t){
  let n = 0;
  L.chairs.forEach(ch => { if (ch.table === t && ch.dirty){ ch.dirty = null; n++; } });
  if (n){ const s = L.spots[t]; floater(s.x, s.y, n > 1 ? `Cleaned ${n} dishes` : 'Cleaned', false); sfx.tap(); tone(1320, .08, 'sine', .04, .05); }
  return n;
}
// Tap test for dirty tables, in screen pixels relative to the canvas.
function tableAt(px, py){
  let best = -1, bd = Infinity;
  const seen = new Set();
  for (const ch of L.chairs){
    if (!ch.dirty || seen.has(ch.table)) continue;
    seen.add(ch.table);
    const s = L.spots[ch.table], [sx, sy] = P(s.x, s.y, .62), d = Math.hypot(px - sx, py - (sy - hw * .25));
    if (d < bd){ bd = d; best = ch.table; }
  }
  return bd < Math.max(34, hw * 1.1) ? best : -1;
}
function waitSpots(){
  const out = [];

    out.push([WAIT_X0 + .5 + (WAIT_COLS - 1 - k) * WAIT_GAP, WAIT_Y0 + .5 + r * WAIT_GAP]);
  return out;
}
function waitZone(){ return { x0:WAIT_X0, x1:WAIT_X0 + 1 + (WAIT_COLS - 1) * WAIT_GAP, y0:WAIT_Y0, y1:WAIT_Y0 + 1 + (WAIT_ROWS - 1) * WAIT_GAP }; }
function freeWaitSpot(){
  const taken = new Set(customers.filter(o => o.state === 'wait' || (o.state === 'toWait')).map(o => o.wspot));
  for (let i = 0; i < WAIT_COLS * WAIT_ROWS; i++) if (!taken.has(i)) return i;
  return -1;
}
const waitingCount = () => customers.filter(o => o.state === 'wait').length;
function resetFloor(){

  spawnT = 1; layout(); camX = camY = 0;
}

/* ---------------- Customers ---------------- */
const slot = i => [L.regX, 2.5 + i * .8];
function queuePath(c, i){
  const [sx, sy] = slot(i);
  if (c.x >= L.regX - .01) return [[sx, sy]];
  if (c.x >= L.laneQ - .01) return [[L.laneQ, sy], [sx, sy]];
  const p = c.x < L.door[0] ? [L.door] : [];
  return [...p, [L.laneQ, L.dy], [L.laneQ, sy], [sx, sy]];
}
function reflowQueue(){ queue.forEach((c, i) => { c.path = queuePath(c, i); }); }
function exitPath(c){
  // back to the one door, then outside
  if (c.x < L.laneQ - .01 && Math.abs(c.y - L.dy) < .05) return [L.door, L.outside];
  return [[L.laneQ, c.y], [L.laneQ, L.dy], L.door, L.outside];
}
function spawn(vip){
  const st = STAGES[S.stage];
  if (queue.length >= st.queue){ S.dayMissed++; return; }
  const owned = ITEMS.filter(it => S.items[it.id].owned);
  const weights = owned.map((_, i) => 1 + i * .35), sum = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * sum, item = owned[0];
  for (let i = 0; i < owned.length; i++){ r -= weights[i]; if (r <= 0){ item = owned[i]; break; } }
  const pat = vip ? 60 : 45;
  const c = { id:nextId++, x:L.outside[0], y:L.outside[1], state:'enter', item, vip, patience:pat, maxP:pat,
    dine:Math.random() < DINE_IN_CHANCE, body: vip ? '#C99A2E' : pick(BODY), skin:pick(SKIN), hair:pick(HAIR), phase:Math.random() * 6,
    look:{ hair:pick(Object.keys(HAIRS)), top: vip ? 'vip' : pick(CUSTOMER_TOPS) }, anim:Math.random() * 3, face:1,
    path:[], claimed:false, seat:null, sitT:0, waitT:0, waitedSeat:false, wait:0 };
  queue.push(c); customers.push(c); reflowQueue();
}
function claimNext(){ return queue.find(c => !c.claimed && c.state === 'queue'); }
function claim(c){ c.claimed = true; c.wait = c.maxP - c.patience; }
function removeFromQueue(c){

}
function serve(c){
  removeFromQueue(c);
  const pay = price(c.item) * tipMult() * (c.dine ? 1.2 : 1) * (c.vip ? 3 : 1) * (active('rush') ? 2 : 1);
  earn(pay);
  floater(c.x, c.y, '+' + fmtPrice(pay), c.vip);
  sfx.coin();
  c.claimed = false;
  if (c.dine){
    const seat = freeChair();
    if (seat) goSit(c, seat);
    else {
      const k = freeWaitSpot();
      if (k < 0){ c.state = 'leave'; c.path = exitPath(c); S.dayMissed++; floater(c.x, c.y, 'No chair', false, true); rate(c, 1, 'noseat'); }
      else { c.state = 'wait'; c.wspot = k; c.waitT = SEAT_WAIT; c.waitedSeat = true; c.path = [[L.laneQ, c.y], waitSpots()[k]]; }
    }

function goSit(c, seat){

}
function giveUp(c){

  floater(c.x, c.y, 'Left', false, true);
  rate(c, Math.random() < .7 ? 1 : 2, 'bad');
}

/* ---------------- Ratings ---------------- */
function serviceStars(c){
  const f = c.wait / c.maxP;
  let s = f < .2 ? 5 : f < .45 ? 4 : f < .7 ? 3 : 2;
  if (s < 5 && decoCount() >= 4 && Math.random() < .3) s++;
  if (c.waitedSeat) s--;
  return Math.max(1, Math.min(5, s));
}
function rate(c, stars, kind){
  if (Math.random() >= RATE_CHANCE) return; // half of customers never rate, good or bad
  S.rt.push(stars); if (S.rt.length > 100) S.rt.shift();
  const pool = kind || (stars >= 4 ? 'good' : stars === 3 ? (decoCount() < 3 && Math.random() < .5 ? 'plain' : 'okay') : 'bad');
  if (Math.random() < COMMENT_CHANCE){
    const text = pick(COMMENTS[pool]).replace('{item}', c.item.name.toLowerCase());
    S.reviews.unshift({ n:pick(NAMES), s:stars, t:text, d:S.day, a:Math.floor(Math.random() * AVATAR.length), at:Date.now() });
    if (S.reviews.length > 40) S.reviews.pop();
    S.unread = Math.min(99, (S.unread || 0) + 1);
    if (!$('#phone').hidden) renderPhone();
  }
  floaters.push({ x:c.x, y:c.y, text:'★'.repeat(stars), star:stars, t:-1.1 });
}
function arrive(c){
  if (c.state === 'enter'){ c.state = 'queue'; }
  else if (c.state === 'queue' || c.state === 'wait'){ /* standing in place */ }
  else if (c.state === 'toSeat'){ c.state = 'sit'; c.sitT = 8 + Math.random() * 7; }
  else if (c.state === 'leave') c.gone = true;
}
function updateCustomers(dt){
  for (const c of customers){
    c.phase += dt * 9; c.anim += dt;

      const [tx, ty] = c.path[0], dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy), step = 1.8 * dt;
      const sdx = dx - dy; if (Math.abs(sdx) > .01) c.face = sdx > 0 ? 1 : -1; // screen direction
      if (d <= step){ c.x = tx; c.y = ty; c.path.shift(); if (!c.path.length) arrive(c); }
      else { c.x += dx / d * step; c.y += dy / d * step; }

/* ---------------- Making orders ---------------- */
function updatePreps(dt){
  S.baristas.forEach((lvl, i) => {
    if (preps.some(p => p.who === i)) return;
    const c = claimNext();
    if (c){ claim(c); preps.push({ who:i, c, t:0, need:prepTime(c.item) }); }
  });
  const wm = workMult();
  for (const p of preps){
    const sp = p.who === 'p' ? 1 : baristaSpeed(S.baristas[p.who] || 0);
    p.t += dt * sp * wm;
    if (p.t >= p.need){ p.done = true; serve(p.c); }
  }
  preps = preps.filter(p => !p.done);
}
function brewTap(){
  unlockAudio();
  if (paused) return;
  const mine = preps.find(p => p.who === 'p');
  if (mine){ mine.t += mine.need * .22; sfx.tap(); return; }
  const c = claimNext();
  if (c){
    claim(c);
    const need = prepTime(c.item);
    preps.push({ who:'p', c, t:need * .22, need });
    sfx.tap(); return;
  }
  const help = preps.find(p => p.who !== 'p');
  if (help){ help.t += help.need * .12; sfx.tap(); return; }
  sfx.no();
}

/* ---------------- Money ---------------- */
function earn(n){

  earnLog.push([performance.now(), n]);
}
function pay(n){

}

function endDay(){

}

let section = null, sub = { upgrade:'menu' }, lastPanel = '';

}
function openDrawer(sec){

  $('#dTitle').textContent = def.title;
  const st = $('#subtabs');
  if (def.tabs){
    st.hidden = false;
    st.innerHTML = def.tabs.map(([k, n]) => `<button role="tab" data-sub="${k}" aria-selected="${sub[sec] === k}">${n}</button>`).join('');
  } else st.hidden = true;
  document.querySelectorAll('#dock [data-sec]').forEach(b => b.setAttribute('aria-pressed', b.dataset.sec === sec ? 'true' : 'false'));
  $('#drawer').hidden = false; $('#actrow').hidden = true;
  $('#panel').scrollTop = 0; renderPanel(true); measure();
}

});

  sub[section] = b.dataset.sub;
  document.querySelectorAll('#subtabs [data-sub]').forEach(t => t.setAttribute('aria-selected', t === b ? 'true' : 'false'));
  $('#panel').scrollTop = 0; renderPanel(true);
});
$('#panel').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled || !b.dataset.act) return;
  unlockAudio(); act(b.dataset.act);
});
function act(a){
  const [k, arg, how] = a.split(':'), st = STAGES[S.stage];
  switch (k){
    case 'item': {
      const it = ITEMS.find(i => i.id === arg), s = S.items[arg];
      if (S.stage < it.stage) break;
      if (!s.owned){ if (pay(it.unlock)){ s.owned = true; toast(`${it.name} is on the menu.`); } }
      else if (s.lvl < MAX_ITEM_LVL && pay(cost.item(it))) s.lvl++;
      break;
    }
    case 'machine': if (S.machine < MAX_MACHINE && pay(cost.machine())) S.machine++; break;
    case 'seat': if (S.seats < st.maxSeats && pay(cost.seat())){ S.seats++; rebuildChairs(); } break;
    case 'deco': { const d = DECOR.find(x => x.id === arg); if (d && !has(d.id) && pay(d.cost)){ S.deco[d.id] = true; toast(`${d.name} added to your café.`); } break; }
    case 'hire': if (S.baristas.length < st.maxBaristas && pay(cost.hire())){ S.baristas.push(0); toast('New barista hired. They will make orders on their own.'); } break;
    case 'train': { const i = +arg; if (S.baristas[i] < MAX_BARISTA_LVL && pay(cost.train(i))) S.baristas[i]++; break; }
    case 'cashier': if (S.cashier < MAX_CASHIER && pay(cost.cashier())) S.cashier++; break;
    case 'expand': {
      const nx = STAGES[S.stage + 1];
      if (nx && pay(nx.cost)){ const oldN = L.N; S.stage++; S.gems += 5; resetFloor(); zoom = clampZoom(zoom * L.N / oldN); sfx.big(); toast(`Welcome to your ${nx.name}! +5 gems.`); }
      break;
    }
    case 'pow': usePower(arg, how); return;
    case 'buy': {
      const base = [500, 5000, 50000, 500000][S.stage];
      if (arg === 'supporter'){ S.supporter = true; S.gems += 100; sfx.big(); toast('Supporter pack unlocked (test). Rewards no longer need ads. +100 gems.'); }
      else if (arg[0] === 'g'){ const n = { g1:50, g2:160, g3:450 }[arg]; S.gems += n; sfx.coin(); toast(`${n} gems added (test purchase).`); }
      else { const m = { c1:1, c2:3, c3:8 }[arg]; earn(base * m); sfx.coin(); toast(`${fmt(base * m)} added (test purchase).`); }
      break;
    }
    case 'restore': toast('Purchases restored (test mode).'); break;
  }
  renderPanel(true); save();
}
function badges(){
  let up = false;
  for (const it of ITEMS){ const s = S.items[it.id]; if (S.stage >= it.stage && !s.owned && can(it.unlock)){ up = true; break; } }
  const st = STAGES[S.stage];
  if (!up && S.baristas.length < st.maxBaristas && can(cost.hire())) up = true;
  if (!up && STAGES[S.stage + 1] && can(STAGES[S.stage + 1].cost)) up = true;
  if (!up && S.seats < st.maxSeats && can(cost.seat())) up = true;
  const dec = DECOR.some(d => !has(d.id) && can(d.cost));
  const pw = adsAvailable() && POWER.some(p => !(p.dur && active(p.id)) && Date.now() >= S.boosts[p.id].adAt);
  $('[data-badge="upgrade"]').hidden = !up || section === 'upgrade';
  $('[data-badge="decor"]').hidden = !dec || section === 'decor';
  $('[data-badge="power"]').hidden = !pw || section === 'power';
}

/* ---------------- Camera ---------------- */
let zoom = 0, camX = 0, camY = 0, velX = 0, velY = 0, topH = 110, botH = 150;
const ZMIN = .8;
function fitPx(){
  const cw = canvas.clientWidth || innerWidth, ch = canvas.clientHeight || innerHeight;
  const availH = Math.max(160, ch - topH - botH);
  return Math.min(cw * .92 / (2 * L.N), availH / (L.N + WALL + .3));
}
const zmax = () => Math.max(2.8, 95 / fitPx());
const clampZoom = z => Math.min(zmax(), Math.max(ZMIN, z));
function measure(){
  topH = $('#top').getBoundingClientRect().height;
  const b = $('#bottom').getBoundingClientRect();
  botH = section ? ($('#dock').getBoundingClientRect().height + 20) : b.height;
}
window.addEventListener('resize', measure);
const pointers = new Map();
let drag = null, pinch = null;
canvas.addEventListener('pointerdown', e => {
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 1){ drag = { x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, moved:false, t:performance.now() }; velX = velY = 0; }
  else if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinch = { d:Math.hypot(a.x - b.x, a.y - b.y) || 1, z:zoom };
    if (drag) drag.moved = true;
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && pointers.size >= 2){
    const [a, b] = [...pointers.values()];
    zoom = clampZoom(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d);
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, now = performance.now();
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8){ drag.moved = true; canvas.classList.add('dragging'); }
  if (drag.moved){
    camX += dx; camY += dy;
    const dtm = Math.max(1, now - drag.t);
    velX = dx / dtm * 16; velY = dy / dtm * 16;
  }
  drag.x = e.clientX; drag.y = e.clientY; drag.t = now;
});
function endPointer(e){
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0 && drag){
    if (!drag.moved && e.type === 'pointerup'){
      if (section) closeDrawer();
      else {
        const r = canvas.getBoundingClientRect(), t = tableAt(e.clientX - r.left, e.clientY - r.top);
        if (t >= 0){ unlockAudio(); cleanTable(t); } else brewTap();
      }
    }
    if (performance.now() - drag.t > 80){ velX = velY = 0; }
    drag = null; canvas.classList.remove('dragging');
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = clampZoom(zoom * Math.exp(-e.deltaY * .0015)); }, { passive:false });

/* ---------------- Drawing ---------------- */
let dpr = 1, hw = 0, hh = 0, ox = 0, oy = 0;
const WALL = 2.2;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const P = (x, y, z = 0) => [ox + (x - y) * hw, oy + (x + y) * hh - z * hw];
function poly(pts, fill, stroke, lw){
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}
function box(x, y, w, d, z, h, top, left, right){
  poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)], left);
  poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)], right);
  poly([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], top);
}
function rrect(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function line(a, b, color, lw){ ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke(); }

function drawGround(){
  // the street in front of the café, so panning past the room still shows a place
  // a soft sidewalk along the two open sides of the café
  const N = L.N, M = N + 1.6;
  poly([P(0, N, -.3), P(M, N, -.3), P(M, M, -.3), P(0, M, -.3)], 'rgba(150,160,145,.13)');
  poly([P(N, 0, -.3), P(M, 0, -.3), P(M, N, -.3), P(N, N, -.3)], 'rgba(150,160,145,.13)');
}
function drawFloor(){
  const N = L.N, tiled = has('tiles');
  poly([P(0, 0), P(N, 0), P(N, N), P(0, N)], tiled ? '#EEEBE5' : '#E8DDCA');
  if (tiled){
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++)
      if ((i + j) % 2) poly([P(i, j), P(i + 1, j), P(i + 1, j + 1), P(i, j + 1)], '#DCD6CB');
  } else {
    for (let y = .5; y < N; y += .5) line(P(0, y), P(N, y), 'rgba(140,105,60,.13)', 1);
  }
  poly([P(0, N), P(N, N), P(N, N, -.28), P(0, N, -.28)], tiled ? '#D3CDC2' : '#D2C3AB');
  poly([P(N, 0), P(N, N), P(N, N, -.28), P(N, 0, -.28)], tiled ? '#C4BDB1' : '#C2B197');
}
function wallRectL(y0, y1, z0, z1, fill, stroke){ poly([P(.01, y0, z0), P(.01, y1, z0), P(.01, y1, z1), P(.01, y0, z1)], fill, stroke, 1.5); }
function wallRectR(x0, x1, z0, z1, fill, stroke){ poly([P(x0, .01, z0), P(x1, .01, z0), P(x1, .01, z1), P(x0, .01, z1)], fill, stroke, 1.5); }
function drawWalls(){
  const N = L.N, H = WALL;
  poly([P(0, 0, 0), P(0, N, 0), P(0, N, H), P(0, 0, H)], '#F4F2ED');
  poly([P(0, 0, 0), P(N, 0, 0), P(N, 0, H), P(0, 0, H)], '#E6E2DA');
  if (has('panel')){
    wallRectL(0, N, 0, .9, '#CDB18B'); wallRectR(0, N, 0, .9, '#BFA27B');
    line(P(.01, 0, .9), P(.01, N, .9), '#B3956D', 2); line(P(0, .01, .9), P(N, .01, .9), '#A88A62', 2);
  }

  ctx.lineJoin = 'round';
  ctx.beginPath(); const a = P(0, N, H), b = P(0, 0, H), c = P(N, 0, H);
  ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]);
  ctx.strokeStyle = '#CFC8BC'; ctx.lineWidth = Math.max(2, hw * .08); ctx.stroke();

    poly([P(6.8, .02, 1.15), P(7.15, .02, 1.15), P(7.15, .02, 1.42), P(6.8, .02, 1.42)], '#D9A441');

}
function drawDoor(){

function windowL(y0, y1){

function windowR(x0, x1){

function neon(x, z){

// What the guest leaves behind matches what they ordered: a coffee cup, a tall glass, or a plate with crumbs.
function drawDish(x, y, d){

    box(x - .07, y - .07, .14, .14, z, .11, '#FFFFFF', '#E3DFD8', '#EDEAE4');
    const [cx, cy] = P(x, y, z + .11);
    ctx.beginPath(); ctx.ellipse(cx, cy, hw * .07, hw * .035, 0, 0, Math.PI * 2); ctx.fillStyle = '#6B4A33'; ctx.fill();

    const [cx, cy] = P(x, y, z + .005);
    ctx.beginPath(); ctx.ellipse(cx, cy, hw * .17, hw * .085, 0, 0, Math.PI * 2); ctx.fillStyle = '#FFFFFF'; ctx.fill();

  const v = $('#vipBtn');
  if (vipOffer && now < vipOffer.until && adsAvailable()){
    v.hidden = false; v.textContent = `VIP tip ${fmt(vipOffer.amount)} · ${S.supporter ? 'Claim' : 'Watch ad'} (${Math.ceil((vipOffer.until - now) / 1000)}s)`;
  } else { v.hidden = true; if (vipOffer && now >= vipOffer.until) vipOffer = null; }

  slowT -= .1;
  if (slowT <= 0){ slowT = .5; renderPanel(false); badges(); measure(); }
}

/* ---------------- Loop ---------------- */
let lastT = performance.now(), saveT = 0;
function frame(now){
  const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  if (!paused){
    spawnT -= dt * (active('magnet') ? 2 : 1);
    if (spawnT <= 0){ spawn(false); spawnT = (BASE_GAP / appeal()) * (.6 + Math.random() * .8); }
    vipT -= dt; if (vipT <= 0){ spawn(true); vipT = 150 + Math.random() * 150; }
    updateCustomers(dt); updatePreps(dt);
    for (const f of floaters) f.t += dt; floaters = floaters.filter(f => f.t < 1.3);
    S.dayT += dt; if (S.dayT >= DAY_LEN){ S.dayT -= DAY_LEN; endDay(); }
    saveT += dt; if (saveT > 5){ saveT = 0; save(); }
  }
  if (!drag && (Math.abs(velX) > .05 || Math.abs(velY) > .05)){ camX += velX; camY += velY; velX *= .9; velY *= .9; }
  draw();
  hudT -= dt; if (hudT <= 0){ hudT = .1; hud(now); }
  requestAnimationFrame(frame);
}

/* ---------------- Input ---------------- */
$('#brew').addEventListener('pointerdown', e => { e.preventDefault(); brewTap(); });
$('#brew').addEventListener('click', e => { if (e.detail === 0) brewTap(); });
document.addEventListener('keydown', e => {
  if (!$('#modal').hidden || !$('#ad').hidden) return;
  if (e.key === 'Escape' && !$('#phone').hidden){ closePhone(); return; }
  if (e.key === 'Escape' && section){ closeDrawer(); return; }
  if ((e.code === 'Space' && e.target === document.body) || e.key === 'b'){ e.preventDefault(); brewTap(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ save(); }
  else {
    const away = (Date.now() - S.lastSeen) / 1000;
    lastT = performance.now();
    if ($('#modal').hidden && $('#ad').hidden) welcomeBack(away);
    S.lastSeen = Date.now();
  }
});
window.addEventListener('pagehide', save);
window.addEventListener('online', () => renderPanel(true));
window.addEventListener('offline', () => renderPanel(true));

/* ---------------- Boot ---------------- */
function boot(data){
  let fromHot = false;
  if (data && data.S){ S = migrate(data.S); fromHot = true; }
  const had = fromHot || load();
  layout(); measure();
  try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch {}
  if (!fromHot){
    const away = (Date.now() - S.lastSeen) / 1000;
    if (had) welcomeBack(away);
    else toast('Welcome to Beanery! Tap Brew or the café to make each order. Drag to look around.', 5500);
  }
  S.lastSeen = Date.now();
  lastT = performance.now();
  requestAnimationFrame(frame);
}
try {
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});
} catch { boot({}); }
})();
</script>
